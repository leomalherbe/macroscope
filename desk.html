<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macroscope · Policy desk</title>
<meta name="description" content="Submit your group's macroeconomic policy decisions for the OPEN-MU simulation game.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2026111401">
<script src="i18n.js?v=2026111401"></script>
<script src="i18n/fr-desk.js?v=2026111401"></script>
<script src="guide.js?v=2026111401"></script>
<script src="config.js?v=2026111401"></script>
<script src="core.js?v=2026111401"></script>
<script src="app-common.js?v=2026111401"></script>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="top-tools"><a id="boardBtn" class="guide-btn" target="_blank" rel="noopener" hidden>Board</a><button type="button" id="guideBtn" class="guide-btn" hidden>How it works?</button><div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button></div></div>
    <div>
      <div class="kicker" id="courseLabel">Macroscope · the open-economy policy game</div>
      <h1>Macroscope · Policy desk</h1>
      <p class="sub">Submit your group's policy decisions. <a id="homeLink" href="#">← About Macroscope</a> · <a href="model.html" target="_blank">The model: equations &amp; notation ↗</a></p>
    </div>
    <div class="who" id="who"></div>
  </div>
</div>

<main><div class="wrap" id="app"><div class="card"><p class="muted">Loading…</p></div></div></main>

<footer><div class="wrap"><span>Macroscope · runs on OPEN-MU, a stock-flow consistent model of a monetary union after Godley &amp; Lavoie · <a href="index.html">about</a></span><span id="footTime"></span></div></footer>

<script>
(function () {
  'use strict';
  var $ = UI.$, $$ = UI.$$, el = UI.el, esc = UI.esc;
  MXL.apply(); MXL.watch(document.body);
  /* the beginners' guide (guide.js): which card a lever's ⓘ opens */
  var LEVER_GUIDE = { pubdem: 'demand', benefits: 'demand households', inctax: 'demand households', vat: 'vat', ctax: 'climate', green: 'climate', rate: 'rate?', tariffU: 'exit' };
  var cfg = window.MACSIM_CONFIG || {};
  $('#courseLabel').textContent = cfg.COURSE_LABEL || 'Macroscope';
  $('#homeLink').href = cfg.COURSE_HOME || '#';

  var app = $('#app');
  var pin = new URLSearchParams(location.search).get('pin') || UI.read('macsim.pin') || '';
  var data = null;            // last server answer
  var offset = 0;             // server time − client time (ms)
  var formKey = null;         // phase|round of the form currently built
  var councilKey = null;
  var forumKey = null;
  var tgKey = null;           // state of the telegram composer currently built        // year|quota left of the forum composer currently built
  var pollTimer = null, tick = null;

  /* ---------------- login ---------------- */
  function renderLogin(msg) {
    app.innerHTML = '';
    var input = el('input', { type: 'text', inputmode: 'numeric', placeholder: '4-digit PIN', style: 'font-size:1.3rem;width:160px;text-align:center;letter-spacing:.2em', autofocus: true });
    var btn = el('button', { class: 'btn primary', onclick: function () { go(); } }, ['Enter the desk']);
    function go() { pin = input.value.trim(); if (!pin) return; UI.store('macsim.pin', pin); load(); }
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    app.appendChild(el('div', { class: 'card', style: 'max-width:520px;margin:30px auto' }, [
      el('h2', {}, ['Your group PIN']),
      el('p', { class: 'muted' }, ['Each group received a 4-digit PIN from the instructor. One submission per group: agree on your decisions, then one of you submits.']),
      msg ? el('div', { class: 'err' }, [msg]) : null,
      el('div', { class: 'inline', style: 'margin-top:10px' }, [input, btn])
    ]));
    if (!MSApi.apiUrl()) app.appendChild(el('div', { class: 'card alert' }, [el('b', {}, ['No backend configured. ']), 'The site administrator must set API_URL in config.js.']));
    input.focus();
  }

  /* ---------------- loading ---------------- */
  async function load(quiet) {
    if (!pin) { renderLogin(); return; }
    try {
      var r = await MSApi.call('state', { pin: pin });
      if (!r.ok) { if (/PIN/i.test(r.error || '')) { UI.store('macsim.pin', null); pin = ''; renderLogin(r.error); } else UI.toast(r.error || 'Error'); return; }
      data = r;
      offset = Date.parse(r.now) - Date.now();
    } catch (e) {
      if (!quiet) { app.innerHTML = ''; app.appendChild(el('div', { class: 'card alert' }, [el('b', {}, ['Cannot reach the server. ']), String(e.message || e), ' ', el('button', { class: 'btn sm', onclick: function () { load(); } }, ['Retry'])])); }
      return;
    }
    /* the class's board (projector view), in a new tab */
    var bb = $('#boardBtn'), cid = data.group && data.group.classId;
    if (bb && cid) { var api = new URLSearchParams(location.search).get('api'); bb.href = 'board.html?class=' + encodeURIComponent(cid) + (api && !cfg.API_URL ? '&api=' + encodeURIComponent(api) : ''); bb.hidden = false; }
    try { render(); $('#footTime').textContent = 'Updated ' + UI.fmtTime(data.now); }
    catch (e2) {
      if (window.console) console.error(e2);
      app.insertBefore(el('div', { class: 'card alert' }, [el('b', {}, ['Display error: ']), String(e2 && e2.message ? e2.message : e2), ' — reload the page (Ctrl+Shift+R); if it persists, tell the administrator.']), app.firstChild);
    }
  }

  /* ---------------- rendering ---------------- */
  function phaseLabel(st) {
    if (st.phase === 'warmup') return 'Warm-up · ' + MS.countryName(st.warmup.country) + ' · ' + st.warmup.years + '-year plan';
    return 'The game · Year ' + st.round + ' of ' + st.years;
  }
  function render() {
    var st = data.state, g = data.group;
    $('#who').innerHTML = '<b>' + esc(g.name) + '</b>' + (st.phase === 'game' ? (g.country ? esc(MS.countryName(g.country)) : '<span class="pill">no country yet</span>') : esc(MS.countryName(st.warmup.country)) + ' <span class="pill">warm-up</span>') +
      ' · <a href="#" id="switch">switch group</a>';
    $('#switch').onclick = function (e) { e.preventDefault(); UI.store('macsim.pin', null); pin = ''; formKey = null; renderLogin(); };

    var key = st.phase + '|' + st.round;
    if (!$('#strip')) {
      app.innerHTML = '';
      app.appendChild(el('div', { id: 'strip', class: 'strip' }));
      app.appendChild(el('div', { id: 'communique' }));
      app.appendChild(el('div', { id: 'council' }));
      app.appendChild(el('div', { id: 'forum' }));
      app.appendChild(el('div', { id: 'telegrams' }));
      app.appendChild(el('div', { id: 'form' }));
      app.appendChild(el('div', { id: 'results' }));
      app.appendChild(el('div', { id: 'forecasts' }));
      app.appendChild(el('div', { id: 'reveals' }));
      app.appendChild(el('div', { id: 'alldecisions' }));
      app.appendChild(el('div', { id: 'history' }));
    }
    renderStrip();
    var com = $('#communique');
    com.innerHTML = st.communique ? '<div class="communique"><div class="kicker">Administrator’s communiqué</div>' + '<span translate="no">' + esc(st.communique) + '</span>' + '</div><div style="height:18px"></div>' : '';

    if (formKey !== key) { buildForm(); formKey = key; }
    else updateFormStatus();
    renderCouncil();
    renderForum();
    renderTelegrams();
    renderResults();
    renderForecasts();
    renderReveals();
    renderAllDecisions();
    renderHistory();
    MXGUIDE.update(st);
  }

  function renderStrip() {
    var st = data.state, strip = $('#strip');
    strip.innerHTML = '';
    strip.appendChild(el('span', { class: 'big' }, [phaseLabel(st)]));
    strip.appendChild(el('span', { class: 'pill ' + (data.roundOpen ? 'open' : 'closed') }, [data.roundOpen ? 'Submissions open' : 'Submissions closed']));
    if (st.deadline && data.roundOpen) strip.appendChild(el('span', { class: 'countdown', id: 'countdown' }, ['–:––']));
    if (st.phase === 'game' && st.councilOpen) strip.appendChild(el('span', { class: 'pill gold' }, ['Council in session']));
    if (data.forum && data.forum.on) { var nf = data.forum.proposals.filter(function (p) { return p.round === data.forum.year && !p.withdrawn && !p.hidden; }).length; strip.appendChild(el('a', { class: 'pill gold', href: '#forum' }, ['Forum: ' + nf + ' proposal' + (nf === 1 ? '' : 's')])); }
    if (data.telegrams) { var nt = tgUnread().length; if (nt) strip.appendChild(el('a', { class: 'pill gold', href: '#telegrams' }, [nt === 1 ? '1 new telegram' : nt + ' new telegrams'])); }
    strip.appendChild(el('span', { class: 'spacer' }));
    strip.appendChild(el('button', { class: 'btn sm ghost', onclick: function () { load(); UI.toast('Refreshed'); } }, ['↻ Refresh']));
    updateCountdown();
  }
  function updateCountdown() {
    var c = $('#countdown'); if (!c || !data) return;
    var t = UI.countdownText(data.state.deadline, offset);
    if (!t) return; c.textContent = (t.late ? 'Time is up ' : '') + t.text; c.classList.toggle('late', t.late);
  }

  /* ---------------- decision form ---------------- */
  function formConfig() {
    var st = data.state, isWarm = st.phase === 'warmup';
    var ctryF = isWarm ? st.warmup.country : data.group.country;
    var avail = isWarm ? MS.leversFor(st) : MS.leversForCountry(st, ctryF, st.round);   // v2.0 classes: carbon tax and green investment too; §12: an exited country gains its policy rate
    var allowed = isWarm ? st.warmup.allowed : avail.map(function (l) { return l.id; });
    return {
      isWarm: isWarm,
      nYears: isWarm ? st.warmup.years : 1,
      levers: avail.filter(function (l) { return allowed.indexOf(l.id) >= 0; }),
      eco: MS.isEcoModel(st),
      hh: MS.householdsOn(st),
      tariff: isWarm ? allowed.indexOf('tariff') >= 0 : st.game.allowTariff !== false,
      euro: !isWarm && MS.exitAllowed(st) && MS.exitYearOf(st, ctryF) === null,   /* §12: the exit announcement */
      out: !isWarm && MS.isOutIn(st, ctryF, st.round),                          /* §12: exchange-rate decisions of an exited country */
      tfp: isWarm ? allowed.indexOf('tfp') >= 0 : !!st.game.allowTfp,
      maxNonZero: isWarm ? st.warmup.maxNonZero : st.game.maxNonZero,
      minText: isWarm ? st.warmup.minText : st.game.minText,
      country: isWarm ? st.warmup.country : data.group.country,
      bounds: st.bounds
    };
  }
  function myDecision(phase, round) {
    return (data.myDecisions || []).filter(function (d) { return d.phase === phase && Number(d.round) === Number(round); })[0] || null;
  }
  /* − / + buttons around every number field of the desk: many phone keypads have no minus sign. One press = the field's step,
     at least 0.5 for the levers typed to the tenth; the bounds hold; typing stays possible. Added to every new field. */
  function addSteppers(root) {
    Array.prototype.forEach.call((root || document).querySelectorAll('input[type=number]:not([data-st])'), function (inp) {
      inp.setAttribute('data-st', '1');
      var st0 = Number(inp.getAttribute('step')) || 1, bstep = st0 >= 0.25 ? st0 : 0.5;
      var dec = String(bstep).indexOf('.') >= 0 ? String(bstep).split('.')[1].length : 0;
      var wrap = el('span', { class: 'stepper' });
      function btn(sign) {
        return el('button', { type: 'button', class: 'st-btn', tabindex: '-1', 'aria-label': sign < 0 ? 'decrease' : 'increase', onclick: function () {
          if (inp.disabled || inp.readOnly) return;
          var v = MS.num(inp.value) || 0, lo = inp.min !== '' ? Number(inp.min) : -Infinity, hi = inp.max !== '' ? Number(inp.max) : Infinity;
          v = Math.round((v + sign * bstep) / bstep) * bstep;
          v = Math.max(lo, Math.min(hi, v));
          inp.value = String(Number(v.toFixed(Math.max(dec, 2))));
          inp.dispatchEvent(new Event('input', { bubbles: true })); inp.dispatchEvent(new Event('change', { bubbles: true }));
        } }, [sign < 0 ? '−' : '+']);
      }
      inp.parentNode.insertBefore(wrap, inp);
      wrap.appendChild(btn(-1)); wrap.appendChild(inp); wrap.appendChild(btn(1));
    });
  }
  if (window.MutationObserver) new MutationObserver(function () { addSteppers(document.getElementById('app')); }).observe(document.getElementById('app') || document.body, { childList: true, subtree: true });
  function numInput(name, value, bound, step) {
    var inp = el('input', { type: 'number', name: name, step: step || 0.1, min: -bound, max: bound, value: value || 0 });
    inp.addEventListener('input', onInput);
    inp.addEventListener('focus', function () { inp.select(); });
    if (MS.num(inp.value)) inp.classList.add('nz');
    return inp;
  }
  function onInput() {
    var f = formConfig();
    UI.$$('#form input[type=number]').forEach(function (i) {
      var v = MS.num(i.value); var b = Number(i.max);
      i.classList.toggle('nz', !!v); i.classList.toggle('bad', isNaN(v) || Math.abs(v) > b + 1e-9);
    });
    var used = MS.usedInstruments(readForm());
    var c = $('#usedCounter'); if (c) { c.textContent = 'Instruments used: ' + used.length + (f.maxNonZero ? ' / ' + f.maxNonZero : ''); c.classList.toggle('bad', f.maxNonZero && used.length > f.maxNonZero); }
    var ta = $('#decisionText'), tc = $('#textCounter');
    if (ta && tc) { tc.textContent = ta.value.trim().length + ' / ' + f.minText + ' characters minimum'; tc.classList.toggle('bad', ta.value.trim().length < f.minText); }
    strategyCounters();
  }
  function readForm() {
    var f = formConfig(); var years = [];
    for (var y = 0; y < f.nYears; y++) {
      var yr = MS.emptyYear();
      f.levers.forEach(function (l) { var i = $('#form [name="L_' + l.id + '_' + y + '"]'); if (i) yr.levers[l.id] = i.value; });
      if (f.tariff) MS.COUNTRIES.concat([MS.ROW]).forEach(function (c) { var i = $('#form [name="T_' + c.id + '_' + y + '"]'); if (i && MS.num(i.value)) yr.tariffs[c.id] = i.value; });
      if (f.euro) { var s = $('#form [name="E_' + y + '"]'); if (s) yr.euro = s.value; }
      if (f.out) {
        var fxs = $('#form [name="FX"]'), pc = $('#form [name="PC"]'), ab = $('#form [name="AB"]');
        yr.fx = fxs ? fxs.value : 'float'; yr.pegChange = yr.fx === 'peg' && pc ? pc.value : 0; yr.absorb = !!(ab && ab.checked);
      }
      if (f.tfp) { var t = $('#form [name="P_' + y + '"]'); if (t) yr.tfp = t.value; }
      years.push(yr);
    }
    var ta = $('#decisionText');
    var out = { years: years, text: ta ? ta.value : '' };
    if ($('#strategy')) out.strategy = readStrategy();
    if (!f.isWarm && votesConfig().on && !f.out) {
      var vr = $('#form input[name="V_rate"]:checked'), vc = $('#form input[name="V_crisis"]:checked');
      out.votes = { rate: vr ? vr.value : 'hold', crisis: vc ? vc.value : 'austerity' };
      var vt = $('#form input[name="V_cet"]:checked'); if (vt) out.votes.cet = Number(vt.value);   /* §13 */
    }
    return out;
  }
  /* union votes: rules from the state, crisis question only when the union ended the last published year under alert */
  function votesConfig() {
    var st = data.state, sim = Object.assign({}, MS.defaultState().sim, st.sim || {});
    var last = (data.union || []).filter(function (r) { return r.phase === 'game' && r.detail && r.detail.extra && Number(r.year) === Number(st.round) - 1; })[0];
    var u = last ? last.detail.extra : null;
    var rec = MS.crisisOf(st, st.round);
    return { on: st.phase === 'game' && sim.votes !== false && !MS.isDuel(st), step: sim.voteStep, cap: sim.austerityCap, deval: sim.devalSize, forced: sim.forcedDeval,
      crisis: !!(rec && rec.status === 'open'), rec: rec, lastYear: last ? last.year : null };
  }
  /* was a crisis vote held in year y? (from the published union rows: the run of year y, or the alert at the end of y−1) */
  function crisisHeld(y) {
    var rec = MS.crisisOf(data.state, y); if (rec) return rec.status === 'closed';
    var rows = (data.union || []).filter(function (r) { return r.phase === 'game' && r.detail && r.detail.extra; });
    var run = rows.filter(function (r) { return Number(r.year) === Number(y); })[0], prev = rows.filter(function (r) { return Number(r.year) === Number(y) - 1; })[0];
    if (run && run.detail.extra.votes) return !!(run.detail.extra.votes.crisis && run.detail.extra.votes.crisis.active);
    return !!(prev && prev.detail.extra.alert && !(prev.detail.extra.R <= 0 && prev.detail.extra.CA < 0));
  }
  function votesBlock(pv) {
    var vc = votesConfig(); if (!vc.on || formConfig().out) return null;   /* §12: a country out of the union no longer votes */
    var prevV = MS.cleanVotes(pv && pv.votes);
    function q(name, title, hint, opts, cur, cls) {
      var box = el('div', { class: 'q' + (cls ? ' ' + cls : '') }); box.appendChild(el('b', name === 'V_cet' ? { 'data-guide': 'exit' } : {}, [title])); box.appendChild(el('span', { class: 'hint' }, [hint]));
      var row = el('div', { class: 'opts' });
      opts.forEach(function (o) { var r = el('input', { type: 'radio', name: name, value: o[0] }); r.checked = cur === o[0]; r.addEventListener('change', onInput); row.appendChild(el('label', {}, [r, o[1]])); });
      box.appendChild(row); return box;
    }
    var wrap = el('div', { class: 'votes' });
    wrap.appendChild(q('V_rate', 'The central bank’s rate', 'One country, one vote. A majority of the countries moves the rate by ' + MS.fmt(vc.step, 2) + ' pt, permanently. It acts the following year, on investment and on every budget’s debt service.',
      [['cut', 'Cut −' + MS.fmt(vc.step, 2) + ' pt'], ['hold', 'Hold'], ['hike', 'Hike +' + MS.fmt(vc.step, 2) + ' pt']], prevV.rate));

    /* §13: the common external tariff, voted each year; the default is the level in force */
    if (MS.tariffsOn(data.state)) {
      var lastU = (data.union || []).filter(function (r) { return r.phase === 'game' && r.key === 'UNION' && r.detail && r.detail.extra; }).sort(function (a, b) { return b.year - a.year; })[0];
      var cetNow = lastU && lastU.detail.extra.cet ? Number(lastU.detail.extra.cet) : 0;
      var curCet = pv && pv.votes && pv.votes.cet !== undefined ? pv.votes.cet : cetNow;
      wrap.appendChild(q('V_cet', 'The common external tariff', 'A tariff on everything the members buy from the rest of the world (now ' + MS.fmt(cetNow, 0) + ' %). The median of the members’ votes wins. It brings revenue to every budget and protects the union’s trade balance, but your households pay it — and the rest of the world may answer with a tariff on your exports.',
        MS.CET_LEVELS.map(function (l) { return [String(l), l + ' %']; }), String(curCet)));
    }
    var card = el('div');
    card.appendChild(el('h3', { style: 'margin:14px 0 2px', 'data-guide': 'rate' }, ['Union votes']));
    card.appendChild(el('p', { class: 'muted small', style: 'margin:0' }, ['Your votes travel with your decisions and stay secret while the round is open; they are revealed with everyone’s decisions once it is closed.']));
    card.appendChild(wrap);
    return card;
  }

  function buildForm() {
    var st = data.state, f = formConfig(), box = $('#form');
    box.innerHTML = '';
    if (st.phase === 'game' && !f.country) {
      box.appendChild(el('div', { class: 'card alert' }, [el('b', {}, ['No country assigned yet. ']), 'The administrator will assign a country to your group before the game starts.']));
      return;
    }
    var prev = myDecision(st.phase, st.round);
    var pv = prev ? prev.payload : null;
    var rec = st.phase === 'game' ? MS.crisisOf(st, st.round) : null, vc0 = st.phase === 'game' ? votesConfig() : null;
    var openR = st.phase === 'game' ? MS.openRetaliation(st, st.round) : null;
    if (openR) { box.appendChild(retaliationCard(openR)); return; }   /* §12 */
    if (rec && rec.status === 'open' && f.out) { box.appendChild(el('div', { class: 'card' }, [el('h2', {}, ['The union’s council is voting']), el('p', { class: 'muted' }, ['The members vote on a reserves or currency crisis of the union. ' + MS.countryName(f.country) + ' has left the union and does not vote; your decisions open once the vote is closed.'])])); return; }
    if (rec && rec.status === 'open') { box.appendChild(crisisVoteCard(rec, vc0)); return; }
    var card = el('div', { class: 'card' });
    var title = f.isWarm ? 'Your ' + f.nYears + '-year plan for ' + MS.countryName(f.country) : 'Decisions for year ' + st.round + ' · ' + MS.countryName(f.country);
    card.appendChild(el('div', { class: 'cardhead' }, [el('h2', {}, [title]), el('span', { id: 'formStatus', class: 'small muted' })]));
    if (!f.isWarm) {
      var wi = MS.weightsInfo(st, st.round, f.country);
      if (wi.elected) card.appendChild(el('div', { class: 'note', id: 'objectiveNote', html: '<b>Your objective this year</b>' + (wi.label ? ' — ' + esc(wi.label) + (wi.scope === 'ALL' ? ' (union-wide election)' : ' (election in ' + esc(MS.countryName(wi.scope)) + ')') : '') + ': ' + MS.indicatorsFor(data.state).filter(function (i) { return !i.eco || MS.num(wi.weights[i.id]) > 0; }).map(function (i) { return esc(i.label.toLowerCase()) + ' <b>' + esc(MS.fmt(wi.weights[i.id], 2)) + '</b>'; }).join(' · ') + '. Voters have changed what they reward: R is computed with these weights from year ' + esc(wi.year) + ' on.' }));
    }
    var cap = null;
    if (f.out) {
      /* §12: measures of the union in force against this country */
      var mR = MS.retaliationIn(st, f.country, st.round);
      card.appendChild(el('div', { class: 'note', html: '<b>' + esc(MS.countryName(f.country)) + ' is out of the union</b> since year ' + esc(MS.exitYearOf(st, f.country)) + ': your own currency, your own central bank, your own policy rate. ' + (mR.from ? 'Measures of the union in force (council of year ' + esc(mR.from) + '): tariff <b>' + esc(MS.fmt(mR.tariff, 0)) + ' %</b> on your exports to the union, sale of <b>' + esc(MS.fmt(mR.sale, 0)) + ' %</b> a year of your bills held by its central bank' + (mR.settle ? ', <b>settlement of your TARGET balance this year</b>' : '') + '.' : 'The union has voted no measure against you.') }));
    }
    else if (rec && rec.status === 'forced') card.appendChild(el('div', { class: 'note', html: '<b>Reserves exhausted</b> at the end of year ' + (st.round - 1) + ' with the current account still in deficit: a devaluation of ' + esc(MS.fmt(vc0.forced, 0)) + ' % is imposed this year, without a vote.' }));
    else if (rec && rec.status === 'closed' && rec.kind === 'currency') {
      card.appendChild(el('div', { class: 'note', html: '<b>Currency-crisis vote of year ' + st.round + ':</b> ' + esc(UI.currencyTally(rec)) + '. ' + (rec.outcome === 'peg' ? 'The euro is pegged to the rest of the world from this year on: a fixed rate again, defended by the reserves.' : rec.outcome === 'float' ? 'The currency keeps floating.' : 'The central bank raises its rate by ' + esc(MS.fmt((Object.assign({}, MS.defaultState().sim, st.sim || {})).defendStep, 1)) + ' pt this year.') }));
    }

    Object.keys(years).map(Number).sort(function (a, b) { return a - b; }).forEach(function (y) {
      var dg = myDecision('game', y);
      add('game', y, dg && dg.payload && dg.payload.years && dg.payload.years[0] ? dg.payload.years[0].levers : {}, dg, res.filter(function (r) { return r.phase === 'game' && Number(r.year) === y; })[0]);
    });
    var lvCols = levers.filter(function (l) { return lvUsed[l.id]; });
    /* guided strategy, forum, telegrams: their columns only when the class used them */
    var hasStrat = lines.some(function (ln) { return ln.dec && ln.dec.payload && ln.dec.payload.strategy; });
    var fo = data.forum, me = data.group.country, tg = data.telegrams;
    var hasForum = !!(fo && fo.proposals && fo.proposals.length), hasTg = !!(tg && ((tg.sent || []).length || (tg.inbox || []).length));
    var CN = function (c) { return L(MS.countryName(c)); };
    var ARW = { '1': '↑', '0': '≈', '-1': '↓' }, indName = function (id) { var i = inds.filter(function (x) { return x.id === id; })[0]; return i ? L(i.label) : id; };
    var STATUS = { kept: T('kept', 'tenue'), broken: T('not kept', 'non tenue'), words: T('words only', 'paroles seulement'), nodecision: T('no decision', 'pas de décision') };
    var resOf = function (y) { return (data.myResults || []).filter(function (r) { return r.phase === 'game' && Number(r.year) === y; })[0] || null; };
    var head = [T('phase', 'phase'), T('year', 'année')].concat(lvCols.map(function (l) { return L(l.label); }), [T('leave the union', 'sortie de l’union'), T('vote: rate', 'vote : taux'), T('vote: common external tariff', 'vote : tarif extérieur commun'), T('justification', 'justification')],
      inds.map(function (i) { return L(i.label) + ' (' + L(i.unit) + ')'; }), ['R', T('cumulative R', 'R cumulé'), T('R: own policy', 'R : votre politique'), T('R: foreign policies', 'R : politiques étrangères'), T('R: shocks', 'R : chocs'), T('public debt (% of GDP)', 'dette publique (% du PIB)'), T('pledge', 'engagement'), T('analysis', 'analyse')],
      hasStrat ? [T('strategy: shock and votes', 'stratégie : choc et votes'), T('strategy: other countries', 'stratégie : autres pays'), T('strategy: own policy', 'stratégie : notre politique'), T('strategy: priorities', 'stratégie : priorités'), T('improve first', 'améliorer d’abord'), T('accepted to worsen', 'accepté de dégrader'), T('long-term project', 'projet de long terme'), T('project: kept / revised', 'projet : gardé / révisé'), T('why revised', 'pourquoi révisé'), T('forecasts: shocks', 'prévisions : chocs'), T('forecasts: other countries', 'prévisions : autres pays'), T('forecasts: own policy', 'prévisions : notre politique'), T('forecasts right', 'prévisions justes')] : [],
      hasForum ? [T('forum: our proposal', 'forum : notre proposition'), T('forum: supported by', 'forum : soutenue par'), T('forum: rejected by', 'forum : rejetée par'), T('forum: our word', 'forum : notre parole'), T('forum: we supported', 'forum : nous avons soutenu'), T('forum: we rejected', 'forum : nous avons rejeté')] : [],
      hasTg ? [T('telegrams sent', 'télégrammes envoyés'), T('telegrams received', 'télégrammes reçus')] : []);
    var cum = 0, out = [head.map(q).join(sep)];
    lines.forEach(function (ln) {
      var r = ln.row, d = ln.dec, p = d && d.payload ? d.payload : {}, v = p.votes || {}, y0 = p.years && p.years[0] ? p.years[0] : {};
      var sp = r ? UI.rowSplit(r, st, st.weights) : {};
      if (r && r.R !== '' && r.R !== null && r.R !== undefined) cum += Number(r.R);
      var pl = ln.phase === 'game' ? (data.myPledges || []).filter(function (x) { return Number(x.round) === ln.year; })[0] : null;
      var cm = (data.myComments || []).filter(function (x) { return x.phase === ln.phase && (ln.phase === 'warmup' ? ln.year === 1 : Number(x.round) === ln.year); })[0];
      var cells = [ln.phase === 'game' ? T('game', 'partie') : T('warm-up', 'échauffement'), ln.year].concat(lvCols.map(function (l) { return num(ln.lv[l.id]); }),
        [ln.phase === 'game' && y0.euro === 'leave' ? T('announced', 'annoncée') : '', v.rate ? (fr ? ({ cut: 'baisse', hold: 'statu quo', hike: 'hausse' }[v.rate] || v.rate) : v.rate) : '', v.cet !== undefined && v.cet !== null ? v.cet : '', d ? (p.text || '') : ''],
        inds.map(function (i) { return r ? num(r[i.id]) : ''; }),
        [r ? num(r.R) : '', r && r.R !== '' ? num(cum) : '', sp.nat ? num(sp.nat.R) : '', sp.foreign ? num(sp.foreign.R) : '', sp.shock ? num(sp.shock.R) : '', r && r.detail && r.detail.extra ? num(r.detail.extra.debt) : '', pl ? (pl.text || '') : '', cm ? cm.text : '']);
      if (hasStrat) {
        var sg = p.strategy || {}, part = function (id) { return sg[id] ? sg[id].text || '' : ''; };
        var fx = function (id) { var e = sg[id] && sg[id].expect; return e ? Object.keys(e).map(function (k) { return indName(k) + ' ' + ARW[String(e[k])]; }).join(', ') : ''; };
        var fcs = ln.phase === 'game' && p.strategy ? MS.forecastCheck(st, sg, r, resOf(ln.year - 1)) : { n: 0 };
        var pj = sg.project || {};
        cells = cells.concat([part('shock'), part('others'), part('own'), part('prio'), (sg.prio && sg.prio.up || []).map(indName).join(', '), (sg.prio && sg.prio.down || []).map(indName).join(', '),
          pj.text || '', pj.status ? ({ new: T('new', 'nouveau'), kept: T('kept', 'gardé'), revised: T('revised', 'révisé') }[pj.status] || '') : '', pj.why || '',
          fx('shock'), fx('others'), fx('own'), fcs.n ? fcs.hits + ' / ' + fcs.n : '']);
      }
      if (hasForum) {
        var yp = ln.phase === 'game' ? fo.proposals.filter(function (x) { return x.round === ln.year; }) : [];
        var ours = yp.filter(function (x) { return x.country === me; });
        var who = function (sign) { return ours.map(function (x) { return (x.reactions || []).filter(function (rr) { return rr.value === sign; }).map(function (rr) { return CN(rr.country); }).join(', '); }).join(' | '); };
        var gave = function (sign) { return yp.filter(function (x) { return (x.reactions || []).some(function (rr) { return rr.country === me && rr.value === sign; }); }).map(function (x) { return CN(x.country); }).join(', '); };
        cells = cells.concat([
          ours.map(function (x) { return L(UI.FORUM_TYPE_LABEL[x.type] || x.type) + ': ' + x.text + (x.payload && x.payload.askText ? ' — ' + T('in return', 'en retour') + ': ' + x.payload.askText : '') + (x.withdrawn ? ' (' + T('withdrawn', 'retirée') + ')' : ''); }).join(' | '),
          who(1), who(-1),
          ours.map(function (x) { return x.balance ? STATUS[x.balance.author.status] : ''; }).join(' | '),
          gave(1), gave(-1)]);
      }
      if (hasTg) {
        var ofY = function (list) { return (list || []).filter(function (t) { return ln.phase === 'game' && t.round === ln.year && !t.hidden; }); };
        cells = cells.concat([ofY(tg.sent).map(function (t) { return '→ ' + CN(t.to) + ': ' + t.text; }).join(' | '), ofY(tg.inbox).map(function (t) { return '← ' + CN(t.from) + ': ' + t.text; }).join(' | ')]);
      }
      out.push(cells.map(q).join(sep));
    });
    var name = 'macroscope_' + (data.group.country || 'team') + '_' + String(data.group.name || '').replace(/[^\w-]+/g, '_') + '.csv';
    UI.download(name, '﻿' + out.join('\r\n'), 'text/csv;charset=utf-8');
  }
  async function postComment(phase, round) {
    var m = $('#commentMsg'), ta = $('#commentText');
    try {
      var r = await MSApi.call('comment', { pin: pin, phase: phase, round: round, text: ta.value });
      if (!r.ok) { m.innerHTML = '<div class="err">' + esc(r.error) + '</div>'; return; }
      UI.toast('Analysis saved'); load(true);
    } catch (e) { m.innerHTML = '<div class="err">Network error: ' + esc(e.message) + '</div>'; }
  }

  /* ---------------- pledges vs decisions ---------------- */
  function renderReveals() {
    var box = $('#reveals'); box.innerHTML = '';
    (data.reveals || []).forEach(function (rv) {
      var h = '<div class="tablewrap"><table><thead><tr><th>Country</th><th>Pledge</th><th>Actual decision</th><th>Verdict</th></tr></thead><tbody>';
      var countries = {};
      rv.pledges.forEach(function (p) { countries[p.country] = true; }); rv.decisions.forEach(function (d) { countries[d.country] = true; });
      Object.keys(countries).sort().forEach(function (c) {
        var p = rv.pledges.filter(function (x) { return x.country === c; })[0];
        var d = rv.decisions.filter(function (x) { return x.country === c; })[0];
        var verdict = '<span class="muted">no pledge</span>';
        if (p) { var k = MS.pledgeVerdict(p.payload, d ? d.payload : null); verdict = !k.items.length ? '<span class="muted">words only</span>' : (k.kept ? '<span class="kept">✓ kept</span>' : '<span class="broken">✗ broken</span>'); }
        h += '<tr' + (c === data.group.country ? ' class="me"' : '') + '><td><b>' + esc(MS.countryName(c)) + '</b></td><td>' + (p ? '<span translate="no">' + esc(p.text) + '</span>' + '<div class="vals">' + UI.pledgeChipsHtml(p.payload) + '</div>' : '<span class="muted">—</span>') + '</td><td>' + (d ? UI.chipsHtml(d.payload.years[0]) + UI.voteChipsHtml(d.payload.votes, { crisis: crisisHeld(rv.round) }) : '<span class="muted">no decision</span>') + '</td><td>' + verdict + '</td></tr>';
      });
      box.appendChild(el('div', { class: 'card' }, [el('h2', {}, ['Pledges vs decisions · year ' + rv.round]), el('div', { html: h + '</tbody></table></div>' })]));
    });
  }

  /* ---------------- everyone's decisions, once a round is over ---------------- */
  function renderAllDecisions() {
    var box = $('#alldecisions'); box.innerHTML = '';
    var st = data.state;
    if (st.phase !== 'game') return;
    var list = (data.decisionsAll || []).slice().sort(function (a, b) { return b.round - a.round; });
    if (!list.length) {
      if (data.roundOpen) box.appendChild(el('div', { class: 'card' }, [el('h2', {}, [MS.isDuel(st) ? 'Your partner’s decisions' : 'Other countries’ decisions']), el('p', { class: 'muted' }, ['Hidden while the round is open — ' + (MS.isDuel(st) ? 'your partner’s' : 'everyone’s') + ' decisions for year ' + st.round + ' are shown once the round is closed.'])]));
      return;
    }
    list.forEach(function (rd, idx) {
      var hasVotes = rd.decisions.some(function (d) { return d.payload && d.payload.votes; });
      var runRow = (data.union || []).filter(function (r) { return r.phase === 'game' && r.detail && r.detail.extra && Number(r.year) === Number(rd.round); })[0];
      var crisisShown = crisisHeld(rd.round);
      var h = '<div class="tablewrap"><table><thead><tr><th>Country</th><th>Group</th><th>Decisions</th>' + (hasVotes ? '<th>Votes</th>' : '') + '<th>Submitted</th></tr></thead><tbody>';
      var ddx = MS.isDuel(st) ? MS.duelOf(data.group.country) : null;
      var rows = rd.decisions.filter(function (d) { return !ddx || d.country === ddx.key || d.country === ddx.partner; }).slice().sort(function (a, b) { return MS.countryName(a.country).localeCompare(MS.countryName(b.country)); });
      rows.forEach(function (d) {
        var g = (data.groups || []).filter(function (x) { return x.groupId === d.groupId; })[0];
        h += '<tr' + (d.country === data.group.country ? ' class="me"' : '') + '><td><b>' + esc(MS.countryName(d.country)) + '</b></td><td class="small muted">' + esc(g ? g.name : '') + '</td><td>' + UI.chipsHtml(d.payload.years[0]) + '</td>' + (hasVotes ? '<td>' + (UI.voteChipsHtml(d.payload.votes, { crisis: crisisShown }) || '<span class="muted">—</span>') + '</td>' : '') + '<td class="small muted">' + esc(UI.fmtTime(d.ts)) + '</td></tr>';
      });
      var missing = (data.groups || []).filter(function (g) { return g.country && (!ddx || g.country === ddx.key || g.country === ddx.partner) && !rd.decisions.some(function (d) { return d.groupId === g.groupId; }); });
      missing.forEach(function (g) { h += '<tr><td><b>' + esc(MS.countryName(g.country)) + '</b></td><td class="small muted">' + esc(g.name) + '</td><td><span class="chip zero">no decision submitted</span></td>' + (hasVotes ? '<td><span class="chip zero">hold' + (crisisShown ? ' · austerity' : '') + '</span></td>' : '') + '<td></td></tr>'; });
      if (runRow && runRow.detail.extra.votes) h += '<tr><td colspan="' + (hasVotes ? 5 : 4) + '" class="small muted">' + UI.voteLinesHtml(runRow.detail.extra).replace(/class="urow"/g, 'class="urow inline"') + '</td></tr>';
      var card = el('div', { class: 'card' });
      var title = (ddx ? 'Your duel’s decisions · year ' : 'Everyone’s decisions · year ') + rd.round + (rd.round === Number(st.round) ? ' (round closed)' : '');
      var recC = MS.crisisOf(st, rd.round);
      if (recC && recC.status === 'closed') {
        var cv = (rd.crisisVotes || []).slice().sort(function (a, b) { return MS.countryName(a.country).localeCompare(MS.countryName(b.country)); });
        var missingC = (data.groups || []).filter(function (g) { return g.country && !cv.some(function (x) { return x.groupId === g.groupId; }); });
        h += '<tr><td colspan="' + (hasVotes ? 5 : 4) + '"><b>Crisis vote · year ' + rd.round + '</b>: ' + esc(UI.crisisTally(recC)) + ' → <b>' + esc(UI.crisisWord(recC.outcome)) + '</b><div class="chips">' +
          cv.map(function (x) { return '<span class="chip vote">' + esc(MS.countryName(x.country)) + ': ' + esc(UI.crisisWord(x.crisis)) + '</span>'; }).join('') + missingC.map(function (g) { return '<span class="chip zero">' + esc(MS.countryName(g.country)) + ': austerity (no vote)</span>'; }).join('') + '</div></td></tr>';
      }
      /* §12: votes of the councils on retaliation of that year */
      var rvs = (rd.retaliationVotes || []), tgs = {}; rvs.forEach(function (x) { tgs[x.target] = 1; });
      Object.keys(tgs).forEach(function (tg) {
        var rr = MS.retaliationOf(st, rd.round, tg); if (!rr || rr.status !== 'closed') return; var o = rr.outcome || {};
        h += '<tr><td colspan="' + (hasVotes ? 5 : 4) + '"><b>Council on retaliation against ' + esc(MS.countryName(tg)) + ' · year ' + rd.round + '</b>: tariff ' + esc(MS.fmt(o.tariff || 0, 0)) + ' % · sale ' + esc(MS.fmt(o.sale || 0, 0)) + ' %' + (rr.settleOpen ? ' · TARGET settled: ' + (o.settle ? 'yes' : 'no') : '') + ' (median of the votes)<div class="chips">' +
          rvs.filter(function (x) { return x.target === tg; }).map(function (x) { return '<span class="chip vote">' + esc(MS.countryName(x.country)) + ': tariff ' + esc(x.tariff) + ' % · sale ' + esc(x.sale) + ' %' + (x.settle ? ' · settle' : '') + '</span>'; }).join('') + '</div></td></tr>';
      });
      if (!rd.decisions.length && !missing.length && !(recC && recC.status === 'closed') && !rvs.length) return;
      if (idx === 0) { card.appendChild(el('h2', {}, [title])); card.appendChild(el('div', { html: h + '</tbody></table></div>' })); }
      else { var det = el('details', {}, [el('summary', {}, [title])]); det.appendChild(el('div', { html: h + '</tbody></table></div>' })); card.appendChild(det); }
      box.appendChild(card);
    });
  }

  /* ---------------- history ---------------- */
  function renderHistory() {
    var st = data.state, box = $('#history'); box.innerHTML = '';
    var past = (data.myDecisions || []).filter(function (d) { return d.phase === 'game' && Number(d.round) < Number(st.round); }).sort(function (a, b) { return a.round - b.round; });
    if (st.phase !== 'game' || !past.length) return;
    var det = el('details', {}, [el('summary', {}, ['Your previous decisions (' + past.length + ')'])]);
    past.forEach(function (d) { det.appendChild(el('div', { class: 'pledge', html: '<b>Year ' + d.round + '</b> <span class="muted small">' + esc(UI.fmtDateTime(d.ts)) + '</span><br>' + UI.chipsHtml(d.payload.years[0]) + UI.voteChipsHtml(d.payload.votes, { crisis: crisisHeld(d.round) }) + '<p class="small" style="margin:6px 0 0">' + '<span translate="no">' + esc(d.payload.text) + '</span>' + '</p>' })); });
    box.appendChild(el('div', { class: 'card' }, [det]));
  }

  /* ---------------- timers ---------------- */
  tick = setInterval(updateCountdown, 1000);
  /* every 10 s, a tiny « anything new? »; the state is reloaded only when something was written (or every 2 min, or when the
     deadline has just passed) */
  pollTimer = setInterval(async function () {
    if (document.hidden || !pin) return;
    var late = data && data.roundOpen && data.state && data.state.deadline && Date.parse(data.state.deadline) <= Date.now() + offset;
    if (late || await MSApi.due('desk', 120000, 30000)) load(true);
  }, 10000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && pin) load(true); });
  load();
})();
