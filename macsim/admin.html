<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacSim 2 · Administrator</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="core.js"></script>
<script src="app-common.js"></script>
<script src="report.js"></script>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div>
      <div class="kicker" id="courseLabel">International Financial Macroeconomics</div>
      <h1>MacSim 2 · Administrator</h1>
      <p class="sub" id="links">Game master console — you type the decisions into MacSim, this page keeps everything else in order.</p>
    </div>
    <div class="who" id="who"></div>
  </div>
</div>

<main><div class="wrap" id="app"><div class="card"><p class="muted">Loading…</p></div></div></main>
<footer><div class="wrap"><span>MacSim 2 · Administrator console</span><span id="footTime"></span></div></footer>

<script>
(function () {
  'use strict';
  var $ = UI.$, $$ = UI.$$, el = UI.el, esc = UI.esc;
  var cfg = window.MACSIM_CONFIG || {};
  $('#courseLabel').textContent = cfg.COURSE_LABEL || 'International Financial Macroeconomics';
  var app = $('#app');
  var key = UI.read('macsim.adminKey') || '';
  var classes = [], classId = UI.read('macsim.classId') || '';
  var ov = null;              // admin.overview answer
  var offset = 0;
  var tab = UI.read('macsim.adminTab') || 'control';
  var pollTimer = null;

  function studentUrl(pin) {
    var u = location.href.replace(/admin\.html.*$/, 'index.html');
    var q = [];
    if (pin) q.push('pin=' + encodeURIComponent(pin));
    if (!cfg.API_URL) q.push('api=' + encodeURIComponent(MSApi.apiUrl()));
    return u + (q.length ? '?' + q.join('&') : '');
  }
  function boardUrl() {
    var u = location.href.replace(/admin\.html.*$/, 'board.html') + '?class=' + encodeURIComponent(classId);
    if (!cfg.API_URL) u += '&api=' + encodeURIComponent(MSApi.apiUrl());
    return u;
  }
  async function admin(action, params) {
    var r = await MSApi.call(action, Object.assign({ key: key, classId: classId }, params || {}));
    if (!r.ok) { UI.toast(r.error || 'Error', 4000); if (/administrator key/i.test(r.error || '')) { key = ''; renderLogin(r.error); } }
    return r;
  }

  /* ---------------- login ---------------- */
  function renderLogin(msg) {
    app.innerHTML = '';
    var url = el('input', { type: 'url', placeholder: 'https://script.google.com/macros/s/…/exec', style: 'width:100%', value: MSApi.apiUrl() });
    var k = el('input', { type: 'password', placeholder: 'administrator key (Config tab of the Sheet)', style: 'width:100%', value: key });
    var btn = el('button', { class: 'btn primary', onclick: go }, ['Connect']);
    async function go() {
      MSApi.setApiUrl(url.value.trim()); key = k.value.trim();
      try {
        var r = await MSApi.call('admin.login', { key: key });
        if (!r.ok) { renderLogin(r.error); return; }
        UI.store('macsim.adminKey', key); classes = r.classes; offset = Date.parse(r.now) - Date.now();
        if (!classes.some(function (c) { return c.id === classId; })) classId = classes.length ? classes[0].id : '';
        UI.store('macsim.classId', classId);
        boot();
      } catch (e) { renderLogin('Cannot reach the backend: ' + e.message); }
    }
    k.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    app.appendChild(el('div', { class: 'card', style: 'max-width:640px;margin:30px auto' }, [
      el('h2', {}, ['Connect to the backend']),
      el('p', { class: 'muted small' }, ['The backend is the Google Apps Script web app bound to your Google Sheet (see README). The key was generated by setup() and is stored in the Config tab.']),
      msg ? el('div', { class: 'err' }, [msg]) : null,
      el('div', { class: 'field' }, [el('label', {}, ['Web app URL']), url]),
      el('div', { class: 'field' }, [el('label', {}, ['Administrator key']), k]),
      el('div', { class: 'btnrow' }, [btn])
    ]));
  }

  /* ---------------- shell ---------------- */
  async function boot() {
    if (!key || !MSApi.apiUrl()) { renderLogin(); return; }
    if (!classes.length) {
      try { var r = await MSApi.call('admin.login', { key: key }); if (!r.ok) { renderLogin(r.error); return; } classes = r.classes; }
      catch (e) { renderLogin('Cannot reach the backend: ' + e.message); return; }
      if (!classes.some(function (c) { return c.id === classId; })) classId = classes.length ? classes[0].id : '';
    }
    app.innerHTML = '';
    app.appendChild(el('div', { id: 'classbar', class: 'strip' }));
    app.appendChild(el('div', { id: 'strip', class: 'strip' }));
    app.appendChild(el('div', { id: 'tabs', class: 'tabs' }));
    app.appendChild(el('div', { id: 'view' }));
    renderClassBar();
    if (classId) await refresh(); else renderNoClass();
    clearInterval(pollTimer);
    pollTimer = setInterval(function () { if (!document.hidden && classId && (tab === 'control' || tab === 'entry' || tab === 'council')) refresh(true); }, 20000);
  }
  function renderClassBar() {
    var bar = $('#classbar'); bar.innerHTML = '';
    var sel = el('select', { onchange: function () { classId = sel.value; UI.store('macsim.classId', classId); refresh(); } });
    classes.forEach(function (c) { sel.appendChild(el('option', { value: c.id }, [c.name])); });
    sel.value = classId;
    bar.appendChild(el('span', { class: 'muted small' }, ['Class']));
    bar.appendChild(sel);
    bar.appendChild(el('button', { class: 'btn sm ghost', onclick: createClass }, ['+ New class']));
    bar.appendChild(el('span', { class: 'spacer' }));
    if (classId) {
      bar.appendChild(el('a', { class: 'btn sm ghost', href: boardUrl(), target: '_blank' }, ['Open the board ↗']));
      bar.appendChild(el('a', { class: 'btn sm ghost', href: studentUrl(), target: '_blank' }, ['Student page ↗']));
    }
    if (classId) bar.appendChild(el('button', { class: 'btn sm danger', onclick: deleteClass }, ['Delete class…']));
    bar.appendChild(el('button', { class: 'btn sm ghost', onclick: function () { key = ''; UI.store('macsim.adminKey', null); renderLogin(); } }, ['Log out']));
  }
  async function deleteClass() {
    var cls = classes.filter(function (c) { return c.id === classId; })[0]; if (!cls) return;
    var typed = prompt('Delete the class « ' + cls.name + ' » with all its groups, PINs, decisions, results, pledges and analyses? This cannot be undone.\n\nType the class name to confirm:');
    if (typed === null) return;
    if (typed.trim() !== cls.name) { UI.toast('Name does not match — nothing deleted', 4000); return; }
    var r = await MSApi.call('admin.class.delete', { key: key, classId: classId, name: typed.trim() });
    if (!r.ok) { UI.toast(r.error || 'Error', 5000); return; }
    classes = r.classes; classId = classes.length ? classes[0].id : ''; UI.store('macsim.classId', classId);
    UI.toast('Class deleted (' + r.removed + ' rows removed)', 4000);
    renderClassBar(); if (classId) refresh(); else renderNoClass();
  }
  async function createClass() {
    var name = prompt('Name of the class (e.g. "M1 Finance – group A")');
    if (!name) return;
    var r = await MSApi.call('admin.class.create', { key: key, name: name });
    if (!r.ok) { UI.toast(r.error); return; }
    classes = r.classes; classId = r.classId; UI.store('macsim.classId', classId);
    renderClassBar(); refresh();
  }
  function renderNoClass() {
    $('#strip').innerHTML = ''; $('#tabs').innerHTML = '';
    $('#view').innerHTML = '<div class="card"><h2>No class yet</h2><p class="muted">Create a class (one per group of students playing together), then add its groups.</p></div>';
  }

  async function refresh(quiet) {
    try {
      var r = await MSApi.call('admin.overview', { key: key, classId: classId });
      if (!r.ok) { if (/administrator key/i.test(r.error)) { key = ''; renderLogin(r.error); } else UI.toast(r.error); return; }
      ov = r; offset = Date.parse(r.now) - Date.now();
      $('#footTime').textContent = 'Updated ' + UI.fmtTime(r.now) + ' · backend v' + (r.version || '?');
      renderStrip(); renderTabs();
      if (quiet) { if (tab === 'control') renderStatusGrid(); else if (tab === 'entry') renderEntry(); else if (tab === 'council') renderCouncil(); }
      else renderTab();
    } catch (e) { if (!quiet) UI.toast('Cannot reach the backend: ' + e.message, 4000); }
  }
  function st() { return ov.state; }
  function groupsSorted() { return ov.groups.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }); }
  function groupById(id) { return ov.groups.filter(function (g) { return g.groupId === id; })[0]; }
  function groupByCountry(c) { return ov.groups.filter(function (g) { return g.country === c; })[0]; }
  function decisionsFor(phase, round) { return ov.decisions.filter(function (d) { return d.phase === phase && Number(d.round) === Number(round); }); }
  function phaseLabel(s) { return s.phase === 'warmup' ? 'Warm-up · ' + MS.countryName(s.warmup.country) + ' · ' + s.warmup.years + '-year plans' : 'Game · year ' + s.round + ' of ' + s.years; }

  function renderStrip() {
    var s = st(), strip = $('#strip'); strip.innerHTML = '';
    strip.appendChild(el('span', { class: 'big' }, [phaseLabel(s)]));
    strip.appendChild(el('span', { class: 'pill ' + (ov.roundOpen ? 'open' : 'closed') }, [ov.roundOpen ? 'open' : 'closed']));
    if (s.deadline && ov.roundOpen) strip.appendChild(el('span', { class: 'countdown', id: 'countdown' }, ['–:––']));
    if (s.phase === 'game' && s.councilOpen) strip.appendChild(el('span', { class: 'pill gold' }, ['council in session']));
    var n = decisionsFor(s.phase, s.round).length;
    strip.appendChild(el('span', { class: 'pill blue' }, [n + ' / ' + ov.groups.length + ' submitted']));
    strip.appendChild(el('span', { class: 'spacer' }));
    strip.appendChild(el('button', { class: 'btn sm ghost', onclick: function () { refresh(); } }, ['↻ Refresh']));
    updateCountdown();
  }
  function updateCountdown() {
    var c = $('#countdown'); if (!c || !ov) return;
    var t = UI.countdownText(st().deadline, offset); if (!t) return;
    c.textContent = (t.late ? 'time is up ' : '') + t.text; c.classList.toggle('late', t.late);
  }
  var SHORT = { gdp: 'GDP (%)', unemp: 'Unemp. (pt)', infl: 'Infl. (pt)', pubbal: 'Pub. bal. (pt GDP)', tradebal: 'Trade bal. (pt GDP)' };
  var TABS = [['control', 'Control'], ['groups', 'Groups'], ['entry', 'Entry sheets'], ['results', 'Results'], ['council', 'Council'], ['export', 'Export']];
  function renderTabs() {
    var t = $('#tabs'); t.innerHTML = '';
    TABS.forEach(function (x) {
      var b = el('button', { class: x[0] === tab ? 'active' : '', onclick: function () { tab = x[0]; UI.store('macsim.adminTab', tab); renderTabs(); renderTab(); } }, [x[1]]);
      if (x[0] === 'entry') { var n = decisionsFor(st().phase, st().round).length; if (n) b.appendChild(el('span', { class: 'badge', style: 'background:var(--blue)' }, [String(n)])); }
      t.appendChild(b);
    });
  }
  function renderTab() {
    var v = $('#view'); v.innerHTML = '';
    ({ control: renderControl, groups: renderGroups, entry: renderEntry, results: renderResults, council: renderCouncil, export: renderExport })[tab]();
  }
  async function patch(p, msg) {
    var r = await admin('admin.state.set', { patch: p });
    if (r.ok) { ov.state = r.state; offset = Date.parse(r.now) - Date.now(); if (msg) UI.toast(msg); await refresh(); }
    return r;
  }

  /* ---------------- CONTROL ---------------- */
  function renderControl() {
    var s = st(), v = $('#view');
    var isGame = s.phase === 'game';
    /* phase & round */
    var c1 = el('div', { class: 'card' });
    c1.appendChild(el('h2', {}, ['Phase and round']));
    var row = el('div', { class: 'btnrow' });
    if (!isGame) {
      row.appendChild(el('span', { class: 'pill gold' }, ['warm-up']));
      row.appendChild(el('button', { class: 'btn', onclick: function () { if (confirm('Start the real game at year 1? Submissions will be closed until you open them.')) patch({ phase: 'game', round: 1, status: 'closed', deadline: null, councilOpen: false }, 'Game started — year 1'); } }, ['Start the game → year 1']));
    } else {
      row.appendChild(el('span', { class: 'pill gold' }, ['game · year ' + s.round]));
      row.appendChild(el('button', { class: 'btn', onclick: function () { if (confirm('Move to year ' + (s.round + 1) + '? Make sure the results of year ' + s.round + ' are entered.')) patch({ round: s.round + 1, status: 'closed', deadline: null, councilOpen: false }, 'Year ' + (s.round + 1)); } }, ['Next year → ' + (s.round + 1)]));
      if (s.round > 1) row.appendChild(el('button', { class: 'btn ghost sm', onclick: function () { if (confirm('Go back to year ' + (s.round - 1) + '?')) patch({ round: s.round - 1, status: 'closed', deadline: null, councilOpen: false }); } }, ['← back to ' + (s.round - 1)]));
      row.appendChild(el('button', { class: 'btn ghost sm', onclick: function () { if (confirm('Return to the warm-up phase?')) patch({ phase: 'warmup', round: 1, status: 'closed', deadline: null, councilOpen: false }); } }, ['← back to warm-up']));
    }
    c1.appendChild(row);
    /* open / close / timer */
    var row2 = el('div', { class: 'btnrow' });
    if (ov.roundOpen) row2.appendChild(el('button', { class: 'btn danger', onclick: function () { patch({ status: 'closed' }, 'Submissions closed'); } }, ['■ Close submissions']));
    else row2.appendChild(el('button', { class: 'btn primary', onclick: function () { patch({ status: 'open' }, 'Submissions open'); } }, ['▶ Open submissions']));
    var mins = el('input', { type: 'number', min: 1, max: 180, value: 10, style: 'width:70px' });
    row2.appendChild(el('span', { class: 'muted small' }, ['Timer:']));
    row2.appendChild(mins); row2.appendChild(el('span', { class: 'muted small' }, ['min']));
    row2.appendChild(el('button', { class: 'btn sm', onclick: function () { patch({ status: 'open', deadlineMinutes: Number(mins.value) }, 'Open for ' + mins.value + ' min'); } }, ['Open with timer']));
    if (s.deadline) row2.appendChild(el('button', { class: 'btn sm ghost', onclick: function () { patch({ deadline: null }, 'Timer cleared'); } }, ['Clear timer']));
    c1.appendChild(row2);
    c1.appendChild(el('p', { class: 'muted small', style: 'margin:10px 0 0' }, ['Students may update their submission while the round is open; the last submission counts. The timer is indicative (a 60-second grace period applies); closing is what really stops submissions.']));
    v.appendChild(c1);

    /* communiqué */
    var c2 = el('div', { class: 'card' });
    c2.appendChild(el('h2', {}, ['Administrator’s communiqué']));
    c2.appendChild(el('p', { class: 'muted small' }, ['Shown to every group and on the board: announce the shocks you applied in MacSim, the time left, the agenda of the council…']));
    var ta = el('textarea', { style: 'min-height:80px' }); ta.value = s.communique || '';
    c2.appendChild(ta);
    c2.appendChild(el('div', { class: 'btnrow' }, [el('button', { class: 'btn primary', onclick: function () { patch({ communique: ta.value }, 'Communiqué published'); } }, ['Publish']), el('button', { class: 'btn ghost', onclick: function () { ta.value = ''; patch({ communique: '' }, 'Communiqué cleared'); } }, ['Clear'])]));
    v.appendChild(c2);

    /* status grid */
    var c3 = el('div', { class: 'card' });
    c3.appendChild(el('div', { class: 'cardhead' }, [el('h2', {}, ['Submissions · ' + phaseLabel(s)]), el('span', { class: 'muted small' }, ['refreshes every 20 s'])]));
    c3.appendChild(el('div', { id: 'statusGrid', class: 'status-grid' }));
    v.appendChild(c3);
    renderStatusGrid();

    /* council & visibility */
    var c4 = el('div', { class: 'card' });
    c4.appendChild(el('h2', {}, ['Council of ministers and visibility']));
    var r4 = el('div', { class: 'btnrow' });
    if (isGame) {
      r4.appendChild(el('button', { class: 'btn ' + (s.councilOpen ? 'danger' : 'primary'), onclick: function () { patch({ councilOpen: !s.councilOpen }, s.councilOpen ? 'Council adjourned' : 'Council in session'); } }, [s.councilOpen ? 'Adjourn the council' : 'Convene the council (year ' + s.round + ')']));
      r4.appendChild(el('span', { class: 'muted small' }, ['While in session, groups post public pledges; their actual decisions stay private.']));
    } else r4.appendChild(el('span', { class: 'muted small' }, ['The council is available during the game.']));
    c4.appendChild(r4);
    if (isGame) {
      var rv = el('div', { class: 'checks', style: 'margin-top:10px' });
      rv.appendChild(el('span', { class: 'muted small' }, ['Reveal pledges vs decisions for:']));
      for (var y = 1; y <= Math.max(s.round, 1); y++) {
        (function (yy) {
          var cb = el('input', { type: 'checkbox' }); cb.checked = (s.revealRounds || []).indexOf(yy) >= 0;
          cb.addEventListener('change', function () { var list = (s.revealRounds || []).filter(function (x) { return x !== yy; }); if (cb.checked) list.push(yy); patch({ revealRounds: list.sort() }, 'Reveal updated'); });
          rv.appendChild(el('label', {}, [cb, ' year ' + yy]));
        })(y);
      }
      c4.appendChild(rv);
    }
    var vis = el('div', { class: 'checks', style: 'margin-top:10px' });
    var cbL = el('input', { type: 'checkbox' }); cbL.checked = !!s.publishLeaderboard; cbL.addEventListener('change', function () { patch({ publishLeaderboard: cbL.checked }); });
    vis.appendChild(el('label', {}, [cbL, ' publish the ranking to students and on the board']));
    var cbW = el('input', { type: 'checkbox' }); cbW.checked = !!s.revealWarmup; cbW.addEventListener('change', function () { patch({ revealWarmup: cbW.checked }); });
    vis.appendChild(el('label', {}, [cbW, ' show every group’s warm-up results and plans to everyone (debrief)']));
    var cbD = el('input', { type: 'checkbox' }); cbD.checked = s.showDecisionsWhenClosed !== false; cbD.addEventListener('change', function () { patch({ showDecisionsWhenClosed: cbD.checked }); });
    vis.appendChild(el('label', {}, [cbD, ' once a round is closed, show everyone’s decisions for that round (never while it is open)']));
    c4.appendChild(vis);
    v.appendChild(c4);

    /* parameters */
    var c5 = el('div', { class: 'card' });
    var det = el('details', {}, [el('summary', {}, ['Parameters (bounds, instruments allowed, objective weights)'])]);
    var box = el('div', { style: 'margin-top:12px' });
    function numField(label, val, step) { var i = el('input', { type: 'number', step: step || 0.05, value: val }); return { el: el('div', {}, [el('label', { class: 'small' }, [label]), el('br'), i]), input: i }; }
    var pb = numField('Bound on levers (± %, relative variation)', s.bounds.lever, 0.5), pt = numField('Bound on tariffs (± points, absolute)', s.bounds.tariff, 0.5), pp = numField('Bound on TFP shock (± %)', s.bounds.tfp, 0.5);
    box.appendChild(el('h3', {}, ['Bounds'])); box.appendChild(el('div', { class: 'params' }, [pb.el, pt.el, pp.el]));
    box.appendChild(el('h3', { style: 'margin-top:14px' }, ['Warm-up']));
    var wc = el('select'); MS.COUNTRIES.forEach(function (c) { wc.appendChild(el('option', { value: c.id }, [c.name])); }); wc.value = s.warmup.country;
    var wy = numField('Years in the plan (1–3)', s.warmup.years, 1), wm = numField('Max. instruments (0 = no limit)', s.warmup.maxNonZero, 1), wt = numField('Min. characters, strategy text', s.warmup.minText, 10);
    box.appendChild(el('div', { class: 'params' }, [el('div', {}, [el('label', { class: 'small' }, ['Country']), el('br'), wc]), wy.el, wm.el, wt.el]));
    var allowedBox = el('div', { class: 'checks', style: 'margin-top:8px' });
    var allowedInputs = {};
    MS.LEVERS.concat([MS.TARIFF, MS.EURO, MS.TFP]).forEach(function (l) {
      var cb = el('input', { type: 'checkbox' }); cb.checked = (s.warmup.allowed || []).indexOf(l.id) >= 0; allowedInputs[l.id] = cb;
      allowedBox.appendChild(el('label', {}, [cb, ' ' + (l.n ? l.n + '. ' : '') + l.label]));
    });
    box.appendChild(el('div', { class: 'small muted', style: 'margin-top:8px' }, ['Instruments allowed in the warm-up:'])); box.appendChild(allowedBox);
    box.appendChild(el('h3', { style: 'margin-top:14px' }, ['Game']));
    var gy = numField('Number of years', s.years, 1), gm = numField('Max. instruments (0 = no limit)', s.game.maxNonZero, 1), gt = numField('Min. characters, justification', s.game.minText, 10);
    var gTar = el('input', { type: 'checkbox' }); gTar.checked = s.game.allowTariff !== false;
    var gEu = el('input', { type: 'checkbox' }); gEu.checked = !!s.game.allowEuro;
    var gTfp = el('input', { type: 'checkbox' }); gTfp.checked = !!s.game.allowTfp;
    box.appendChild(el('div', { class: 'params' }, [gy.el, gm.el, gt.el]));
    box.appendChild(el('div', { class: 'checks', style: 'margin-top:8px' }, [el('label', {}, [gTar, ' tariffs allowed']), el('label', {}, [gEu, ' leaving/joining the euro allowed']), el('label', {}, [gTfp, ' TFP shock allowed'])]));
    box.appendChild(el('h3', { style: 'margin-top:14px' }, ['Objective function weights']));
    var wInputs = {};
    box.appendChild(el('div', { class: 'params' }, MS.INDICATORS.map(function (i) { var f = numField((i.sign > 0 ? '+ ' : '− ') + i.label, s.weights[i.id]); wInputs[i.id] = f.input; return f.el; })));
    box.appendChild(el('p', { class: 'muted small' }, ['MacSim’s own defaults are 0.15 (GDP), 0.10 (unemployment), 0.25 (inflation), 0.25 (public balance), 0.25 (trade balance); set the same weights here as in the software so that R matches the report.']));
    box.appendChild(el('div', { class: 'btnrow' }, [el('button', { class: 'btn primary', onclick: function () {
      var allowed = Object.keys(allowedInputs).filter(function (k) { return allowedInputs[k].checked; });
      var w = {}; Object.keys(wInputs).forEach(function (k) { w[k] = MS.num(wInputs[k].value); });
      patch({ bounds: { lever: MS.num(pb.input.value), tariff: MS.num(pt.input.value), tfp: MS.num(pp.input.value) },
        warmup: { country: wc.value, years: Math.max(1, Math.min(3, Math.round(MS.num(wy.input.value)) || 3)), allowed: allowed, maxNonZero: Math.round(MS.num(wm.input.value)), minText: Math.round(MS.num(wt.input.value)) },
        game: { allowTariff: gTar.checked, allowEuro: gEu.checked, allowTfp: gTfp.checked, maxNonZero: Math.round(MS.num(gm.input.value)), minText: Math.round(MS.num(gt.input.value)) },
        years: Math.max(1, Math.round(MS.num(gy.input.value)) || 5), weights: w }, 'Parameters saved');
    } }, ['Save parameters'])]));
    det.appendChild(box); c5.appendChild(det); v.appendChild(c5);
  }
  function renderStatusGrid() {
    var grid = $('#statusGrid'); if (!grid) return;
    var s = st(); grid.innerHTML = '';
    var decs = decisionsFor(s.phase, s.round);
    groupsSorted().forEach(function (g) {
      var d = decs.filter(function (x) { return x.groupId === g.groupId; })[0];
      var sub = s.phase === 'game' ? (g.country ? MS.countryName(g.country) : 'no country!') : MS.countryName(s.warmup.country);
      grid.appendChild(el('div', { class: 'g ' + (d ? 'in' : 'missing') }, [el('b', {}, [g.name]), el('span', { class: 'small' }, [sub + ' · ' + (d ? 'submitted ' + UI.fmtTime(d.ts) : 'missing')])]));
    });
    if (!ov.groups.length) grid.appendChild(el('p', { class: 'muted' }, ['No group yet — add them in the Groups tab.']));
  }

  /* ---------------- GROUPS ---------------- */
  function renderGroups() {

      var decs = decisionsFor('game', rd);
      var h = '<div class="tablewrap"><table><thead><tr><th>Country</th><th>Pledge</th><th>Actual decision</th><th>Verdict</th></tr></thead><tbody>';
      var countries = {}; ov.pledges.filter(function (p) { return p.round === rd; }).forEach(function (p) { countries[p.country] = 1; }); decs.forEach(function (d) { countries[d.country] = 1; });
      Object.keys(countries).sort().forEach(function (cc) {
        var p = ov.pledges.filter(function (x) { return x.round === rd && x.country === cc; })[0];
        var d = decs.filter(function (x) { return x.country === cc; })[0];
        var verdict = '<span class="muted">no pledge</span>';
        if (p) { var k = MS.pledgeKept(p.payload && p.payload.year, d && d.payload ? d.payload.years[0] : null); verdict = !k.items.length ? '<span class="muted">words only</span>' : (k.kept ? '<span class="kept">✓ kept</span>' : '<span class="broken">✗ broken</span>'); }
        h += '<tr><td><b>' + esc(MS.countryName(cc)) + '</b></td><td>' + (p ? esc(p.text) + (p.payload && p.payload.year ? '<div class="vals">' + UI.chipsHtml(p.payload.year) + '</div>' : '') : '—') + '</td><td>' + (d ? UI.chipsHtml(d.payload.years[0]) : '<span class="muted">no decision yet</span>') + '</td><td>' + verdict + '</td></tr>';
      });
      c.appendChild(el('div', { html: h + '</tbody></table></div>' }));
    });
    v.appendChild(c);
  }

  /* ---------------- EXPORT ---------------- */
  function csv(rows, cols) {
    var q = function (x) { x = x === null || x === undefined ? '' : String(x); return /[",\n;]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; };
    return [cols.join(',')].concat(rows.map(function (r) { return cols.map(function (c) { return q(typeof r[c] === 'object' && r[c] !== null ? JSON.stringify(r[c]) : r[c]); }).join(','); })).join('\n');
  }
  function renderExport() {
    var v = $('#view'); v.innerHTML = '';
    var c = el('div', { class: 'card' });
    c.appendChild(el('h2', {}, ['Export']));
    c.appendChild(el('p', { class: 'muted small' }, ['Everything also lives in the Google Sheet (tabs Decisions, Results, Pledges, Comments, Log). These exports are the latest version of each item for this class.']));
    var cls = classes.filter(function (x) { return x.id === classId; })[0]; var tag = (cls ? cls.name : classId).replace(/[^a-z0-9]+/gi, '_');
    var decRows = ov.decisions.map(function (d) { var g = groupById(d.groupId); var o = { ts: d.ts, phase: d.phase, round: d.round, group: g ? g.name : d.groupId, country: MS.countryName(d.country), used: d.used, text: d.text }; d.payload.years.forEach(function (y, i) { MS.LEVERS.forEach(function (l) { o['y' + (i + 1) + '_' + l.id] = y.levers[l.id] || 0; }); o['y' + (i + 1) + '_tariffs'] = Object.keys(y.tariffs || {}).map(function (k) { return k + ':' + y.tariffs[k]; }).join(' '); o['y' + (i + 1) + '_euro'] = y.euro; o['y' + (i + 1) + '_tfp'] = y.tfp || 0; }); return o; });
    var decCols = decRows.length ? Object.keys(decRows.reduce(function (a, r) { Object.keys(r).forEach(function (k) { a[k] = 1; }); return a; }, {})) : [];
    var resRows = ov.results.map(function (r) { var g = r.phase === 'warmup' ? groupById(r.key) : groupByCountry(r.key); return Object.assign({}, r, { who: r.phase === 'warmup' ? (g ? g.name : r.key) : MS.countryName(r.key) + (g ? ' (' + g.name + ')' : '') }); });
    var cmRows = ov.comments.map(function (x) { var g = groupById(x.groupId); return Object.assign({}, x, { group: g ? g.name : x.groupId }); });
    var plRows = ov.pledges.map(function (x) { var g = groupById(x.groupId); return { ts: x.ts, round: x.round, group: g ? g.name : x.groupId, country: MS.countryName(x.country), text: x.text, values: x.payload ? UI.yearChips(x.payload.year).map(function (ch) { return ch.label + ' ' + ch.value; }).join('; ') : '' }; });
    var row = el('div', { class: 'btnrow' });
    row.appendChild(el('button', { class: 'btn', onclick: function () { UI.download('macsim_' + tag + '_decisions.csv', csv(decRows, decCols), 'text/csv'); } }, ['Decisions (CSV)']));
    row.appendChild(el('button', { class: 'btn', onclick: function () { UI.download('macsim_' + tag + '_results.csv', csv(resRows, ['phase', 'round', 'who', 'year', 'gdp', 'unemp', 'infl', 'pubbal', 'tradebal', 'R', 'published', 'ts']), 'text/csv'); } }, ['Results (CSV)']));
    row.appendChild(el('button', { class: 'btn', onclick: function () { UI.download('macsim_' + tag + '_comments.csv', csv(cmRows, ['ts', 'phase', 'round', 'group', 'text']), 'text/csv'); } }, ['Analyses (CSV)']));
    row.appendChild(el('button', { class: 'btn', onclick: function () { UI.download('macsim_' + tag + '_pledges.csv', csv(plRows, ['ts', 'round', 'group', 'country', 'text', 'values']), 'text/csv'); } }, ['Pledges (CSV)']));
    row.appendChild(el('button', { class: 'btn ghost', onclick: function () { UI.download('macsim_' + tag + '_all.json', JSON.stringify(ov, null, 2), 'application/json'); } }, ['Everything (JSON)']));
    c.appendChild(row);
    v.appendChild(c);
  }

  setInterval(updateCountdown, 1000);
  boot();
})();
</script>
</body>
</html>
