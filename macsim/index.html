<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macroscope · Policy desk</title>
<meta name="description" content="Submit your group's macroeconomic policy decisions for the OPEN-MU simulation game.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="core.js"></script>
<script src="app-common.js"></script>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div>
      <div class="kicker" id="courseLabel">Macroscope · the open-economy policy game</div>
      <h1>Macroscope · Policy desk</h1>
      <p class="sub">Submit your group's policy decisions. <a id="homeLink" href="#">← About Macroscope</a> · <a href="model.html" target="_blank">The model: equations &amp; notation ↗</a></p>
    </div>
    <div class="who" id="who"></div>
  </div>
</div>

<main><div class="wrap" id="app"><div class="card"><p class="muted">Loading…</p></div></div></main>

<footer><div class="wrap"><span>Macroscope · runs on OPEN-MU, a stock-flow consistent model of a monetary union after Godley &amp; Lavoie · <a href="../macroscope/">about</a></span><span id="footTime"></span></div></footer>

<script>
(function () {
  'use strict';
  var $ = UI.$, el = UI.el, esc = UI.esc;
  var cfg = window.MACSIM_CONFIG || {};
  $('#courseLabel').textContent = cfg.COURSE_LABEL || 'Macroscope';
  $('#homeLink').href = cfg.COURSE_HOME || '#';

  var app = $('#app');
  var pin = new URLSearchParams(location.search).get('pin') || UI.read('macsim.pin') || '';
  var data = null;            // last server answer
  var offset = 0;             // server time − client time (ms)
  var formKey = null;         // phase|round of the form currently built
  var councilKey = null;
  var pollTimer = null, tick = null;

  /* ---------------- login ---------------- */
  function renderLogin(msg) {
    app.innerHTML = '';
    var input = el('input', { type: 'text', inputmode: 'numeric', placeholder: '4-digit PIN', style: 'font-size:1.3rem;width:160px;text-align:center;letter-spacing:.2em', autofocus: true });
    var btn = el('button', { class: 'btn primary', onclick: function () { go(); } }, ['Enter the desk']);
    function go() { pin = input.value.trim(); if (!pin) return; UI.store('macsim.pin', pin); load(); }
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    app.appendChild(el('div', { class: 'card', style: 'max-width:520px;margin:30px auto' }, [
      el('h2', {}, ['Your group PIN']),
      el('p', { class: 'muted' }, ['Each group received a 4-digit PIN from the instructor. One submission per group: agree on your decisions, then one of you submits.']),
      msg ? el('div', { class: 'err' }, [msg]) : null,
      el('div', { class: 'inline', style: 'margin-top:10px' }, [input, btn])
    ]));
    if (!MSApi.apiUrl()) app.appendChild(el('div', { class: 'card alert' }, [el('b', {}, ['No backend configured. ']), 'The site administrator must set API_URL in config.js.']));
    input.focus();
  }

  /* ---------------- loading ---------------- */
  async function load(quiet) {
    if (!pin) { renderLogin(); return; }
    try {
      var r = await MSApi.call('state', { pin: pin });
      if (!r.ok) { if (/PIN/i.test(r.error || '')) { UI.store('macsim.pin', null); pin = ''; renderLogin(r.error); } else UI.toast(r.error || 'Error'); return; }
      data = r;
      offset = Date.parse(r.now) - Date.now();
      render();
      $('#footTime').textContent = 'Updated ' + UI.fmtTime(r.now);
    } catch (e) {
      if (!quiet) { app.innerHTML = ''; app.appendChild(el('div', { class: 'card alert' }, [el('b', {}, ['Cannot reach the server. ']), String(e.message || e), ' ', el('button', { class: 'btn sm', onclick: function () { load(); } }, ['Retry'])])); }
    }
  }

  /* ---------------- rendering ---------------- */
  function phaseLabel(st) {
    if (st.phase === 'warmup') return 'Warm-up · ' + MS.countryName(st.warmup.country) + ' · ' + st.warmup.years + '-year plan';
    return 'The game · Year ' + st.round + ' of ' + st.years;
  }
  function render() {
    var st = data.state, g = data.group;
    $('#who').innerHTML = '<b>' + esc(g.name) + '</b>' + (st.phase === 'game' ? (g.country ? esc(MS.countryName(g.country)) : '<span class="pill">no country yet</span>') : esc(MS.countryName(st.warmup.country)) + ' <span class="pill">warm-up</span>') +
      ' · <a href="#" id="switch">switch group</a>';
    $('#switch').onclick = function (e) { e.preventDefault(); UI.store('macsim.pin', null); pin = ''; formKey = null; renderLogin(); };

    var key = st.phase + '|' + st.round;
    if (!$('#strip')) {
      app.innerHTML = '';
      app.appendChild(el('div', { id: 'strip', class: 'strip' }));
      app.appendChild(el('div', { id: 'communique' }));
      app.appendChild(el('div', { id: 'council' }));
      app.appendChild(el('div', { id: 'form' }));
      app.appendChild(el('div', { id: 'results' }));
      app.appendChild(el('div', { id: 'reveals' }));
      app.appendChild(el('div', { id: 'alldecisions' }));
      app.appendChild(el('div', { id: 'history' }));
    }
    renderStrip();
    var com = $('#communique');
    com.innerHTML = st.communique ? '<div class="communique"><div class="kicker">Administrator’s communiqué</div>' + esc(st.communique) + '</div><div style="height:18px"></div>' : '';

    if (formKey !== key) { buildForm(); formKey = key; }
    else updateFormStatus();
    renderCouncil();
    renderResults();
    renderReveals();
    renderAllDecisions();
    renderHistory();
  }

  function renderStrip() {
    var st = data.state, strip = $('#strip');
    strip.innerHTML = '';
    strip.appendChild(el('span', { class: 'big' }, [phaseLabel(st)]));
    strip.appendChild(el('span', { class: 'pill ' + (data.roundOpen ? 'open' : 'closed') }, [data.roundOpen ? 'Submissions open' : 'Submissions closed']));
    if (st.deadline && data.roundOpen) strip.appendChild(el('span', { class: 'countdown', id: 'countdown' }, ['–:––']));
    if (st.phase === 'game' && st.councilOpen) strip.appendChild(el('span', { class: 'pill gold' }, ['Council in session']));
    strip.appendChild(el('span', { class: 'spacer' }));
    strip.appendChild(el('button', { class: 'btn sm ghost', onclick: function () { load(); UI.toast('Refreshed'); } }, ['↻ Refresh']));
    updateCountdown();
  }
  function updateCountdown() {
    var c = $('#countdown'); if (!c || !data) return;
    var t = UI.countdownText(data.state.deadline, offset);
    if (!t) return; c.textContent = (t.late ? 'Time is up ' : '') + t.text; c.classList.toggle('late', t.late);
  }

  /* ---------------- decision form ---------------- */
  function formConfig() {
    var st = data.state, isWarm = st.phase === 'warmup';
    var avail = MS.leversFor(st);   // v2.0 classes: carbon tax and green investment too
    var allowed = isWarm ? st.warmup.allowed : avail.map(function (l) { return l.id; });
    return {
      isWarm: isWarm,
      nYears: isWarm ? st.warmup.years : 1,
      levers: avail.filter(function (l) { return allowed.indexOf(l.id) >= 0; }),
      eco: MS.isEcoModel(st),
      tariff: isWarm ? allowed.indexOf('tariff') >= 0 : st.game.allowTariff !== false,
      euro: isWarm ? allowed.indexOf('euro') >= 0 : !!st.game.allowEuro,
      tfp: isWarm ? allowed.indexOf('tfp') >= 0 : !!st.game.allowTfp,
      maxNonZero: isWarm ? st.warmup.maxNonZero : st.game.maxNonZero,
      minText: isWarm ? st.warmup.minText : st.game.minText,
      country: isWarm ? st.warmup.country : data.group.country,
      bounds: st.bounds
    };
  }
  function myDecision(phase, round) {
    return (data.myDecisions || []).filter(function (d) { return d.phase === phase && Number(d.round) === Number(round); })[0] || null;
  }
  function numInput(name, value, bound, step) {
    var inp = el('input', { type: 'number', name: name, step: step || 0.1, min: -bound, max: bound, value: value || 0 });
    inp.addEventListener('input', onInput);
    inp.addEventListener('focus', function () { inp.select(); });
    if (MS.num(inp.value)) inp.classList.add('nz');
    return inp;
  }
  function onInput() {
    var f = formConfig();
    UI.$$('#form input[type=number]').forEach(function (i) {
      var v = MS.num(i.value); var b = Number(i.max);
      i.classList.toggle('nz', !!v); i.classList.toggle('bad', isNaN(v) || Math.abs(v) > b + 1e-9);
    });
    var used = MS.usedInstruments(readForm());
    var c = $('#usedCounter'); if (c) { c.textContent = 'Instruments used: ' + used.length + (f.maxNonZero ? ' / ' + f.maxNonZero : ''); c.classList.toggle('bad', f.maxNonZero && used.length > f.maxNonZero); }
    var ta = $('#decisionText'), tc = $('#textCounter');
    if (ta && tc) { tc.textContent = ta.value.trim().length + ' / ' + f.minText + ' characters minimum'; tc.classList.toggle('bad', ta.value.trim().length < f.minText); }
  }
  function readForm() {
    var f = formConfig(); var years = [];
    for (var y = 0; y < f.nYears; y++) {
      var yr = MS.emptyYear();
      f.levers.forEach(function (l) { var i = $('#form [name="L_' + l.id + '_' + y + '"]'); if (i) yr.levers[l.id] = i.value; });
      if (f.tariff) MS.COUNTRIES.concat([MS.ROW]).forEach(function (c) { var i = $('#form [name="T_' + c.id + '_' + y + '"]'); if (i && MS.num(i.value)) yr.tariffs[c.id] = i.value; });
      if (f.euro) { var s = $('#form [name="E_' + y + '"]'); if (s) yr.euro = s.value; }
      if (f.tfp) { var t = $('#form [name="P_' + y + '"]'); if (t) yr.tfp = t.value; }
      years.push(yr);
    }
    var ta = $('#decisionText');
    var out = { years: years, text: ta ? ta.value : '' };
    if (!f.isWarm && votesConfig().on) {
      var vr = $('#form input[name="V_rate"]:checked'), vc = $('#form input[name="V_crisis"]:checked');
      out.votes = { rate: vr ? vr.value : 'hold', crisis: vc ? vc.value : 'austerity' };
    }
    return out;
  }
  /* votes at the central bank: rules from the state, crisis question only when the union ended the last published year under alert */
  function votesConfig() {
    var st = data.state, sim = Object.assign({}, MS.defaultState().sim, st.sim || {});
    var last = (data.union || []).filter(function (r) { return r.phase === 'game' && r.detail && r.detail.extra && Number(r.year) === Number(st.round) - 1; })[0];
    var u = last ? last.detail.extra : null;
    var rec = MS.crisisOf(st, st.round);
    return { on: st.phase === 'game' && sim.votes !== false && !MS.isDuel(st), step: sim.voteStep, cap: sim.austerityCap, deval: sim.devalSize, forced: sim.forcedDeval,
      crisis: !!(rec && rec.status === 'open'), rec: rec, lastYear: last ? last.year : null };
  }
  /* was a crisis vote held in year y? (from the published union rows: the run of year y, or the alert at the end of y−1) */
  function crisisHeld(y) {
    var rec = MS.crisisOf(data.state, y); if (rec) return rec.status === 'closed';
    var rows = (data.union || []).filter(function (r) { return r.phase === 'game' && r.detail && r.detail.extra; });
    var run = rows.filter(function (r) { return Number(r.year) === Number(y); })[0], prev = rows.filter(function (r) { return Number(r.year) === Number(y) - 1; })[0];
    if (run && run.detail.extra.votes) return !!(run.detail.extra.votes.crisis && run.detail.extra.votes.crisis.active);
    return !!(prev && prev.detail.extra.alert && !(prev.detail.extra.R <= 0 && prev.detail.extra.CA < 0));
  }
  function votesBlock(pv) {
    var vc = votesConfig(); if (!vc.on) return null;
    var prevV = MS.cleanVotes(pv && pv.votes);
    function q(name, title, hint, opts, cur, cls) {
      var box = el('div', { class: 'q' + (cls ? ' ' + cls : '') }); box.appendChild(el('b', {}, [title])); box.appendChild(el('span', { class: 'hint' }, [hint]));
      var row = el('div', { class: 'opts' });
      opts.forEach(function (o) { var r = el('input', { type: 'radio', name: name, value: o[0] }); r.checked = cur === o[0]; r.addEventListener('change', onInput); row.appendChild(el('label', {}, [r, o[1]])); });
      box.appendChild(row); return box;
    }
    var wrap = el('div', { class: 'votes' });
    wrap.appendChild(q('V_rate', 'The central bank’s rate', 'One country, one vote. A majority of the countries moves the rate by ' + MS.fmt(vc.step, 2) + ' pt, permanently. It acts on investment next year and on every budget’s debt service at once.',
      [['cut', 'Cut −' + MS.fmt(vc.step, 2) + ' pt'], ['hold', 'Hold'], ['hike', 'Hike +' + MS.fmt(vc.step, 2) + ' pt']], prevV.rate));

    var card = el('div');
    card.appendChild(el('h3', { style: 'margin:14px 0 2px' }, ['Votes at the central bank']));
    card.appendChild(el('p', { class: 'muted small', style: 'margin:0' }, ['Your votes travel with your decisions and stay secret while the round is open; they are revealed with everyone’s decisions once it is closed.']));
    card.appendChild(wrap);
    return card;
  }

  function buildForm() {
    var st = data.state, f = formConfig(), box = $('#form');
    box.innerHTML = '';
    if (st.phase === 'game' && !f.country) {
      box.appendChild(el('div', { class: 'card alert' }, [el('b', {}, ['No country assigned yet. ']), 'The administrator will assign a country to your group before the game starts.']));
      return;
    }
    var prev = myDecision(st.phase, st.round);
    var pv = prev ? prev.payload : null;
    var rec = st.phase === 'game' ? MS.crisisOf(st, st.round) : null, vc0 = st.phase === 'game' ? votesConfig() : null;
    if (rec && rec.status === 'open') { box.appendChild(crisisVoteCard(rec, vc0)); return; }
    var card = el('div', { class: 'card' });
    var title = f.isWarm ? 'Your ' + f.nYears + '-year plan for ' + MS.countryName(f.country) : 'Decisions for year ' + st.round + ' · ' + MS.countryName(f.country);
    card.appendChild(el('div', { class: 'cardhead' }, [el('h2', {}, [title]), el('span', { id: 'formStatus', class: 'small muted' })]));
    if (!f.isWarm) {
      var wi = MS.weightsInfo(st, st.round, f.country);
      if (wi.elected) card.appendChild(el('div', { class: 'note', id: 'objectiveNote', html: '<b>Your objective this year</b>' + (wi.label ? ' — ' + esc(wi.label) + (wi.scope === 'ALL' ? ' (union-wide election)' : ' (election in ' + esc(MS.countryName(wi.scope)) + ')') : '') + ': ' + MS.indicatorsFor(data.state).filter(function (i) { return !i.eco || MS.num(wi.weights[i.id]) > 0; }).map(function (i) { return esc(i.label.toLowerCase()) + ' <b>' + esc(MS.fmt(wi.weights[i.id], 2)) + '</b>'; }).join(' · ') + '. Voters have changed what they reward: R is computed with these weights from year ' + esc(wi.year) + ' on.' }));
    }
    var cap = null;
    if (rec && rec.status === 'forced') card.appendChild(el('div', { class: 'note', html: '<b>Reserves exhausted</b> at the end of year ' + (st.round - 1) + ' with the current account still in deficit: a devaluation of ' + esc(MS.fmt(vc0.forced, 0)) + ' % is imposed this year, without a vote.' }));
    else if (rec && rec.status === 'closed' && rec.kind === 'currency') {
      card.appendChild(el('div', { class: 'note', html: '<b>Currency-crisis vote of year ' + st.round + ':</b> ' + esc(rec.austerity) + ' defend · ' + esc(rec.devaluation) + ' let it float → <b>' + (rec.outcome === 'float' ? 'let it float' : 'defend') + '</b>. ' + (rec.outcome === 'float' ? 'The currency keeps floating.' : 'The central bank raises its rate by ' + esc(MS.fmt((Object.assign({}, MS.defaultState().sim, st.sim || {})).defendStep, 1)) + ' pt this year.') }));
    }
    else if (rec && rec.status === 'closed') {
      cap = rec.outcome === 'austerity' ? MS.num(vc0.cap) : null;
      card.appendChild(el('div', { class: 'note', html: '<b>Crisis vote of year ' + st.round + ':</b> ' + esc(rec.austerity) + ' austerity · ' + esc(rec.devaluation) + ' devaluation → <b>' + esc(rec.outcome) + '</b>. ' +
        (cap !== null ? 'Austerity programme: public demand and social benefits of every member are capped at <b>' + esc(MS.fmt(cap, 0)) + ' %</b> of the reference this year (the form refuses more).' : 'A devaluation of ' + esc(MS.fmt(vc0.deval, 0)) + ' % is applied this year: exports recover with a lag, import prices and inflation rise.') }));
    }

    var rules = [];
    rules.push('every value is a relative variation, in %, of your country’s reference level (public demand +5 = 5 % more public spending; income tax +5 = a tax rate 5 % higher, e.g. from 20 % to 21 %)');
    if (f.eco) rules.push('the carbon tax and green investment are levels, from 0 to ' + (f.bounds.eco || 10) + ': they cut your carbon intensity from next year on, the tax lifts prices at once. Green investment supports demand like public spending, but 60 % of it is imported equipment (about a third less effect on your GDP than public demand, and a worse trade balance) and its gain on your carbon intensity shrinks as you raise it.');
    if (MS.isDuel(st)) rules.push('the policy rate is yours to set, in points around 3 % (±' + (f.bounds.rate || 2) + '): it moves investment next year, your debt service and the capital flows with your partner — a higher rate appreciates your currency');
    rules.push('each variation between −' + f.bounds.lever + ' % and +' + f.bounds.lever + ' %');
    if (f.maxNonZero) rules.push('at most ' + f.maxNonZero + ' instruments');
    if (f.isWarm) rules.push('all other countries keep their policies unchanged');
    rules.push('0 = no change from the reference');
    if (!f.isWarm && votesConfig().on) rules.push('your votes at the central bank go with your decisions');
    card.appendChild(el('p', { class: 'muted small' }, ['Rules: ' + rules.join(' · ') + '.']));

    /* lever table */
    var tbl = el('table'); var thead = el('thead'); var hr = el('tr', {}, [el('th', {}, ['Instrument']), el('th', {}, ['Unit'])]);
    for (var y = 0; y < f.nYears; y++) hr.appendChild(el('th', { class: 'num' }, [f.nYears > 1 ? 'Year ' + (y + 1) : 'Change']));
    thead.appendChild(hr); tbl.appendChild(thead);
    var tbody = el('tbody');
    f.levers.forEach(function (l) {
      var tr = el('tr', {}, [el('td', { html: '<span class="n muted">' + l.n + '.</span> ' + esc(l.label) + '<span class="hint">' + esc(l.hint) + ' · <i>' + esc(MS.CATS[l.cat].replace(' policies', '')) + '</i></span>' }), el('td', { class: 'unit' }, [l.duel ? 'pt · ±' + (f.bounds.rate || 2) : l.eco ? (l.unit + ' · 0 to ' + (f.bounds.eco || 10)) : '% of ref.'])]);
      for (var y2 = 0; y2 < f.nYears; y2++) { var ni = numInput('L_' + l.id + '_' + y2, pv && pv.years[y2] ? pv.years[y2].levers[l.id] : 0, l.duel ? (f.bounds.rate || 2) : l.eco ? (f.bounds.eco || 10) : f.bounds.lever); if (l.duel) { ni.step = 0.25; } else if (l.eco) { ni.min = 0; ni.step = 0.5; } if (cap !== null && (l.id === 'pubdem' || l.id === 'benefits')) { ni.max = cap; ni.title = 'austerity: at most ' + cap + ' %'; } tr.appendChild(el('td', { class: 'num' }, [ni])); }
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    card.appendChild(el('div', { class: 'tablewrap' }, [tbl]));

    /* tariffs */
    if (f.tariff) {
      var det = el('details', {}, [el('summary', {}, ['11. Import tariffs by partner country (ABSOLUTE variation of the tariff rate, in points of %, between −' + f.bounds.tariff + ' and +' + f.bounds.tariff + ')'])]);
      var tt = el('table'); var tb = el('tbody');
      MS.COUNTRIES.concat([MS.ROW]).forEach(function (c) {
        if (c.id === f.country) return;
        var tr = el('tr', {}, [el('td', {}, [c.id + ' · ' + c.name]), el('td', { class: 'unit' }, ['pt (absolute)'])]);
        for (var y3 = 0; y3 < f.nYears; y3++) tr.appendChild(el('td', { class: 'num' }, [numInput('T_' + c.id + '_' + y3, pv && pv.years[y3] && pv.years[y3].tariffs ? pv.years[y3].tariffs[c.id] : 0, f.bounds.tariff, 0.5)]));
        tb.appendChild(tr);
      });
      tt.appendChild(tb); det.appendChild(el('div', { class: 'tablewrap' }, [tt]));
      card.appendChild(det);
    }
    /* euro + tfp */
    if (f.euro || f.tfp) {
      var ot = el('table'); var ob = el('tbody');
      ob.appendChild(el('tr', { class: 'cat' }, [el('td', { colspan: 2 + f.nYears }, ['Monetary & structural options (subject to the administrator’s approval)'])]));
      var ctry = MS.countryById(f.country);
      if (f.euro) {
        var tr1 = el('tr', {}, [el('td', { html: esc(MS.EURO.label) + '<span class="hint">' + (ctry && ctry.euro ? 'your country is a member of the euro area' : 'your country keeps its own currency') + '</span>' }), el('td', { class: 'unit' }, ['—'])]);
        for (var y4 = 0; y4 < f.nYears; y4++) {
          var sel = el('select', { name: 'E_' + y4 });
          sel.appendChild(el('option', { value: 'none' }, ['no change']));
          sel.appendChild(el('option', { value: ctry && ctry.euro ? 'leave' : 'join' }, [ctry && ctry.euro ? 'leave the euro area' : 'join the euro area']));
          if (pv && pv.years[y4]) sel.value = pv.years[y4].euro || 'none';
          sel.addEventListener('change', onInput);
          tr1.appendChild(el('td', { class: 'num' }, [sel]));
        }
        ob.appendChild(tr1);
      }
      if (f.tfp) {
        var tr2 = el('tr', {}, [el('td', { html: esc(MS.TFP.label) + '<span class="hint">' + esc(MS.TFP.hint) + '</span>' }), el('td', { class: 'unit' }, ['%'])]);
        for (var y5 = 0; y5 < f.nYears; y5++) tr2.appendChild(el('td', { class: 'num' }, [numInput('P_' + y5, pv && pv.years[y5] ? pv.years[y5].tfp : 0, f.bounds.tfp)]));
        ob.appendChild(tr2);
      }
      ot.appendChild(ob); card.appendChild(el('div', { class: 'tablewrap' }, [ot]));
    }
    card.appendChild(el('div', { class: 'counter', id: 'usedCounter', style: 'margin-top:8px' }));

    /* votes (game) */
    var vb = votesBlock(pv); if (vb) card.appendChild(vb);

    /* text */
    var fld = el('div', { class: 'field' });
    fld.appendChild(el('label', { for: 'decisionText' }, [f.isWarm ? 'Your strategy, a priori' : 'Justification']));
    fld.appendChild(el('p', { class: 'muted small', style: 'margin:0 0 6px' }, [f.isWarm
      ? 'Which objective does each instrument target, and through which mechanism of the model? What do you expect for GDP, unemployment, inflation, the public balance and the trade balance?'
      : 'What did you learn from last year’s results, and what do you expect from this year’s decisions? (Mention foreign decisions if they matter.)']));
    var ta = el('textarea', { id: 'decisionText', placeholder: 'Write here…' }); ta.value = pv ? (pv.text || '') : '';
    ta.addEventListener('input', onInput);
    fld.appendChild(ta); fld.appendChild(el('div', { class: 'counter', id: 'textCounter' }));
    card.appendChild(fld);

    card.appendChild(el('div', { id: 'formErrors' }));
    var row = el('div', { class: 'btnrow' });

      : 'Fixed exchange rate: the central bank sells reserves to cover a current-account deficit. Below 25 % of the initial stock (red mark) the administrator may decree a devaluation.']));
    return card;
  }
  /* the five objective dimensions over time, as an SVG chart */
  function trajectoryCard(rows, title) {
    var card = el('div', { class: 'card' });
    card.appendChild(el('div', { class: 'cardhead' }, [el('h2', {}, [title || 'Your objective, year by year']), el('span', { class: 'small muted' }, ['deviation from the reference, year by year'])]));
    card.appendChild(el('div', { id: 'trajectory', html: UI.trajectorySvg(rows, { weights: data.state.weights }) }));
    card.appendChild(el('p', { class: 'trajcap' }, ['Each bar stacks the contributions of the five dimensions to R for the year (weight × deviation; unemployment and inflation count negatively): above zero what helped, below zero what hurt. The dashed line is R itself.']));
    return card;
  }
  function renderResults() {
    var st = data.state, box = $('#results');
    var snap = {}; UI.$$('#results textarea').forEach(function (t) { snap[t.id] = t.value; });
    box.innerHTML = '';
    var w = st.weights;
    if (st.phase === 'warmup') {
      var mine = (data.myResults || []).filter(function (r) { return r.phase === 'warmup'; }).sort(function (a, b) { return a.year - b.year; });
      var card = el('div', { class: 'card' });
      card.appendChild(el('div', { class: 'cardhead' }, [el('h2', {}, ['Your results']), el('span', { class: 'small muted' }, [weightsLine(w)])]));
      if (!mine.length) card.appendChild(el('p', { class: 'muted' }, ['Results will appear here once the administrator has run your plan.']));
      else {
        card.appendChild(el('div', { html: resultsTable(mine.map(function (r) { return Object.assign({ _label: 'Year ' + r.year }, r); })) }));
        var cm = (data.myComments || []).filter(function (c) { return c.phase === 'warmup'; })[0];
        var fld = el('div', { class: 'field' }, [el('label', { for: 'commentText' }, ['Your analysis, a posteriori']),
          el('p', { class: 'muted small', style: 'margin:0 0 6px' }, ['Compare the results with what you expected. Which mechanisms of the model explain the gaps (restoring forces, trade leakages, interest rates)?'])]);
        var ta = el('textarea', { id: 'commentText' }); ta.value = snap.commentText !== undefined ? snap.commentText : (cm ? cm.text : '');
        fld.appendChild(ta); card.appendChild(fld);
        card.appendChild(el('div', { id: 'commentMsg' }, cm ? [el('div', { class: 'ok' }, ['Comment saved at ' + UI.fmtDateTime(cm.ts) + ' — you can still edit it.'])] : []));
        card.appendChild(el('div', { class: 'btnrow' }, [el('button', { class: 'btn primary', onclick: function () { postComment('warmup', 1); } }, [cm ? 'Update our analysis' : 'Submit our analysis'])]));
      }
      var rl = ratiosLine(mine); if (rl) card.appendChild(rl);
      box.appendChild(card);
      if (mine.length) box.appendChild(trajectoryCard(mine, 'Your objective, year by year · ' + MS.countryName(st.warmup.country)));
      var up = unionPanel((data.union || []).filter(function (r) { return r.phase === 'warmup'; }), 'The monetary union during your plan'); if (up) box.appendChild(up);
      if (st.revealWarmup && (data.warmupAll || []).length) {
        var byG = {}; data.warmupAll.forEach(function (r) { (byG[r.key] = byG[r.key] || {})[r.year] = r; });
        var years = []; for (var y = 1; y <= st.warmup.years; y++) years.push(y);
        var h = '<div class="tablewrap"><table><thead><tr><th>Group</th>' + years.map(function (y) { return '<th class="num">R · year ' + y + '</th>'; }).join('') + '<th class="num">Cumulative R</th></tr></thead><tbody>';
        var rows = Object.keys(byG).map(function (k) { var rs = years.map(function (y) { return byG[k][y] ? byG[k][y].R : null; }); var vals = rs.filter(function (x) { return x !== null; }); var avg = vals.length ? MS.round3(vals.reduce(function (a, b) { return a + b; }, 0)) : null; return { key: k, rs: rs, avg: avg }; });
        rows.sort(function (a, b) { return (b.avg === null ? -1e9 : b.avg) - (a.avg === null ? -1e9 : a.avg); });
        rows.forEach(function (r) {
          var gname = ((data.groups || []).filter(function (g) { return g.groupId === r.key; })[0] || {}).name || r.key;
          var plan = (data.warmupPlans || []).filter(function (pl) { return pl.groupId === r.key; })[0];
          var planHtml = plan ? plan.payload.years.map(function (yy, i) { return '<div class="small"><span class="muted">Y' + (i + 1) + '</span> ' + UI.chipsHtml(yy) + '</div>'; }).join('') : '';
          h += '<tr' + (r.key === data.group.groupId ? ' class="me"' : '') + '><td>' + esc(gname) + (planHtml ? '<details class="small"><summary>plan</summary>' + planHtml + '</details>' : '') + '</td>' + r.rs.map(function (x) { return '<td class="num ' + UI.signedClass(x) + '">' + esc(MS.fmt(x, 3, true)) + '</td>'; }).join('') + '<td class="num"><b>' + esc(MS.fmt(r.avg, 3, true)) + '</b></td></tr>';
        });
        box.appendChild(el('div', { class: 'card' }, [el('h2', {}, ['All groups · warm-up debrief']), el('div', { html: h + '</tbody></table></div>' })]));
      }
      return;
    }
    /* game */
    var mineG = (data.myResults || []).filter(function (r) { return r.phase === 'game'; }).sort(function (a, b) { return a.year - b.year; });
    var cardG = el('div', { class: 'card' });
    cardG.appendChild(el('div', { class: 'cardhead' }, [el('h2', {}, [MS.countryName(data.group.country) + ' · results so far']), el('span', { class: 'small muted' }, [weightsLine(w)])]));
    if (!mineG.length) cardG.appendChild(el('p', { class: 'muted' }, ['No year has been simulated yet.']));
    else { cardG.appendChild(el('div', { html: resultsTable(mineG.map(function (r) { return Object.assign({ _label: 'Year ' + r.year }, r); })) })); var rlG = ratiosLine(mineG); if (rlG) cardG.appendChild(rlG); }
    box.appendChild(cardG);
    var dd = MS.isDuel(st) ? MS.duelOf(data.group.country) : null;
    if (dd) {
      /* your duel: the partner's published results, both charts side by side */
      var partnerRows = (data.gameResults || []).filter(function (r) { return r.key === dd.partner && r.published !== false; }).sort(function (a, b) { return a.year - b.year; });
      var pName = data.partner ? data.partner.name : 'your partner';
      var cardP = el('div', { class: 'card' });
      cardP.appendChild(el('div', { class: 'cardhead' }, [el('h2', {}, ['Your partner · ' + MS.countryName(dd.partner) + ' (' + pName + ')']), el('span', { class: 'small muted' }, ['published results'])]));
      if (!partnerRows.length) cardP.appendChild(el('p', { class: 'muted' }, ['Your partner’s results appear here once a year has been simulated and published.']));
      else { cardP.appendChild(el('div', { html: resultsTable(partnerRows.map(function (r) { return Object.assign({ _label: 'Year ' + r.year }, r); })) })); var rlP = ratiosLine(partnerRows); if (rlP) cardP.appendChild(rlP); }
      box.appendChild(cardP);
      if (mineG.length) {
        var cardT = el('div', { class: 'card' });
        cardT.appendChild(el('div', { class: 'cardhead' }, [el('h2', {}, ['The objective, year by year · you and your partner']), el('span', { class: 'small muted' }, ['contributions to R'])]));
        var grid = el('div', { class: 'trajgrid' });
        grid.appendChild(el('div', { id: 'trajectory', html: UI.trajectorySvg(mineG, { weights: st.weights, title: MS.countryName(data.group.country) + ' (you)', legend: false, fontScale: 1.4 }) }));
        if (partnerRows.length) grid.appendChild(el('div', { html: UI.trajectorySvg(partnerRows, { weights: st.weights, title: MS.countryName(dd.partner) + ' (partner)', legend: false, fontScale: 1.4 }) }));
        cardT.appendChild(grid); cardT.appendChild(el('div', { html: UI.trajectoryLegendHtml(true) }));
        cardT.appendChild(el('p', { class: 'trajcap' }, ['Each bar stacks the contributions of the dimensions to R for the year (weight × deviation; unemployment, inflation and emissions count negatively). The dashed line is R.']));
        box.appendChild(cardT);
      }
    } else if (mineG.length) box.appendChild(trajectoryCard(mineG, 'Your objective, year by year · ' + MS.countryName(data.group.country)));
    var upG = unionPanel((data.union || []).filter(function (r) { return r.phase === 'game'; }), 'The monetary union'); if (upG) box.appendChild(upG);
    if (st.publishLeaderboard) {
      var lb = MS.leaderboard(data.gameResults || [], w);
      var cardL = el('div', { class: 'card' });
      cardL.appendChild(el('h2', {}, ['Ranking']));
      if (!lb.length) cardL.appendChild(el('p', { class: 'muted' }, ['The ranking appears after the first simulated year.']));
      else {
        var maxAbs = Math.max.apply(null, lb.map(function (r) { return Math.abs(r.cumR || 0); }).concat([0.01]));
        var yrs = {}; lb.forEach(function (r) { Object.keys(r.years).forEach(function (y) { yrs[y] = true; }); });
        var yl = Object.keys(yrs).map(Number).sort(function (a, b) { return a - b; });
        var hh = '<div class="tablewrap"><table><thead><tr><th>#</th><th>Country</th>' + yl.map(function (y) { return '<th class="num">R · y' + y + '</th>'; }).join('') + '<th class="num">Cumulative R</th><th></th></tr></thead><tbody>';
        lb.forEach(function (r) {
          var cr = r.latestR === null ? null : r.cumR;
          var pct = Math.abs(cr || 0) / maxAbs * 50;
          hh += '<tr' + (r.key === data.group.country ? ' class="me"' : (dd && r.key === dd.partner ? ' class="partner"' : '')) + '><td class="rank">' + r.rank + '</td><td>' + esc(MS.countryName(r.key)) + (r.key === data.group.country ? ' <span class="pill">you</span>' : (dd && r.key === dd.partner ? ' <span class="pill">your partner</span>' : '')) + '</td>' +
            yl.map(function (y) { var e = r.years[y]; return '<td class="num ' + (e ? UI.signedClass(e.R) : '') + '">' + esc(e ? MS.fmt(e.R, 3, true) : '—') + '</td>'; }).join('') +
            '<td class="num ' + UI.signedClass(cr) + '"><b>' + esc(MS.fmt(cr, 3, true)) + '</b></td><td><div class="bar"><i class="' + ((cr || 0) < 0 ? 'neg' : '') + '" style="left:' + ((cr || 0) < 0 ? 50 - pct : 50) + '%;width:' + pct + '%"></i></div></td></tr>';
        });
        cardL.appendChild(el('div', { html: hh + '</tbody></table></div>' }));
        cardL.appendChild(el('p', { class: 'small muted', style: 'margin:.4em 0 0' }, [(dd ? 'Every player of every pair, ranked' : 'Ranked') + ' by the cumulative R: the sum of the yearly scores since year 1.']));
      }
      box.appendChild(cardL);
    }
  }
  async function postComment(phase, round) {
    var m = $('#commentMsg'), ta = $('#commentText');
    try {
      var r = await MSApi.call('comment', { pin: pin, phase: phase, round: round, text: ta.value });
      if (!r.ok) { m.innerHTML = '<div class="err">' + esc(r.error) + '</div>'; return; }
      UI.toast('Analysis saved'); load(true);
    } catch (e) { m.innerHTML = '<div class="err">Network error: ' + esc(e.message) + '</div>'; }
  }

  /* ---------------- pledges vs decisions ---------------- */
  function renderReveals() {
    var box = $('#reveals'); box.innerHTML = '';
    (data.reveals || []).forEach(function (rv) {
      var h = '<div class="tablewrap"><table><thead><tr><th>Country</th><th>Pledge</th><th>Actual decision</th><th>Verdict</th></tr></thead><tbody>';
      var countries = {};
      rv.pledges.forEach(function (p) { countries[p.country] = true; }); rv.decisions.forEach(function (d) { countries[d.country] = true; });
      Object.keys(countries).sort().forEach(function (c) {
        var p = rv.pledges.filter(function (x) { return x.country === c; })[0];
        var d = rv.decisions.filter(function (x) { return x.country === c; })[0];
        var verdict = '<span class="muted">no pledge</span>';
        if (p) { var k = MS.pledgeVerdict(p.payload, d ? d.payload : null); verdict = !k.items.length ? '<span class="muted">words only</span>' : (k.kept ? '<span class="kept">✓ kept</span>' : '<span class="broken">✗ broken</span>'); }
        h += '<tr' + (c === data.group.country ? ' class="me"' : '') + '><td><b>' + esc(MS.countryName(c)) + '</b></td><td>' + (p ? esc(p.text) + '<div class="vals">' + UI.pledgeChipsHtml(p.payload) + '</div>' : '<span class="muted">—</span>') + '</td><td>' + (d ? UI.chipsHtml(d.payload.years[0]) + UI.voteChipsHtml(d.payload.votes, { crisis: crisisHeld(rv.round) }) : '<span class="muted">no decision</span>') + '</td><td>' + verdict + '</td></tr>';
      });
      box.appendChild(el('div', { class: 'card' }, [el('h2', {}, ['Pledges vs decisions · year ' + rv.round]), el('div', { html: h + '</tbody></table></div>' })]));
    });
  }

  /* ---------------- everyone's decisions, once a round is over ---------------- */
  function renderAllDecisions() {
    var box = $('#alldecisions'); box.innerHTML = '';
    var st = data.state;
    if (st.phase !== 'game') return;
    var list = (data.decisionsAll || []).slice().sort(function (a, b) { return b.round - a.round; });
    if (!list.length) {
      if (data.roundOpen) box.appendChild(el('div', { class: 'card' }, [el('h2', {}, [MS.isDuel(st) ? 'Your partner’s decisions' : 'Other countries’ decisions']), el('p', { class: 'muted' }, ['Hidden while the round is open — ' + (MS.isDuel(st) ? 'your partner’s' : 'everyone’s') + ' decisions for year ' + st.round + ' are shown once the round is closed.'])]));
      return;
    }
    list.forEach(function (rd, idx) {
      var hasVotes = rd.decisions.some(function (d) { return d.payload && d.payload.votes; });
      var runRow = (data.union || []).filter(function (r) { return r.phase === 'game' && r.detail && r.detail.extra && Number(r.year) === Number(rd.round); })[0];
      var crisisShown = crisisHeld(rd.round);
      var h = '<div class="tablewrap"><table><thead><tr><th>Country</th><th>Group</th><th>Decisions</th>' + (hasVotes ? '<th>Votes</th>' : '') + '<th>Submitted</th></tr></thead><tbody>';
      var ddx = MS.isDuel(st) ? MS.duelOf(data.group.country) : null;
      var rows = rd.decisions.filter(function (d) { return !ddx || d.country === ddx.key || d.country === ddx.partner; }).slice().sort(function (a, b) { return MS.countryName(a.country).localeCompare(MS.countryName(b.country)); });
      rows.forEach(function (d) {
        var g = (data.groups || []).filter(function (x) { return x.groupId === d.groupId; })[0];
        h += '<tr' + (d.country === data.group.country ? ' class="me"' : '') + '><td><b>' + esc(MS.countryName(d.country)) + '</b></td><td class="small muted">' + esc(g ? g.name : '') + '</td><td>' + UI.chipsHtml(d.payload.years[0]) + '</td>' + (hasVotes ? '<td>' + (UI.voteChipsHtml(d.payload.votes, { crisis: crisisShown }) || '<span class="muted">—</span>') + '</td>' : '') + '<td class="small muted">' + esc(UI.fmtTime(d.ts)) + '</td></tr>';
      });
      var missing = (data.groups || []).filter(function (g) { return g.country && (!ddx || g.country === ddx.key || g.country === ddx.partner) && !rd.decisions.some(function (d) { return d.groupId === g.groupId; }); });
      missing.forEach(function (g) { h += '<tr><td><b>' + esc(MS.countryName(g.country)) + '</b></td><td class="small muted">' + esc(g.name) + '</td><td><span class="chip zero">no decision submitted</span></td>' + (hasVotes ? '<td><span class="chip zero">hold' + (crisisShown ? ' · austerity' : '') + '</span></td>' : '') + '<td></td></tr>'; });
      if (runRow && runRow.detail.extra.votes) h += '<tr><td colspan="' + (hasVotes ? 5 : 4) + '" class="small muted">' + UI.voteLinesHtml(runRow.detail.extra).replace(/class="urow"/g, 'class="urow inline"') + '</td></tr>';
      var card = el('div', { class: 'card' });
      var title = (ddx ? 'Your duel’s decisions · year ' : 'Everyone’s decisions · year ') + rd.round + (rd.round === Number(st.round) ? ' (round closed)' : '');
      var recC = MS.crisisOf(st, rd.round);
      if (recC && recC.status === 'closed') {
        var cv = (rd.crisisVotes || []).slice().sort(function (a, b) { return MS.countryName(a.country).localeCompare(MS.countryName(b.country)); });
        var missingC = (data.groups || []).filter(function (g) { return g.country && !cv.some(function (x) { return x.groupId === g.groupId; }); });
        h += '<tr><td colspan="' + (hasVotes ? 5 : 4) + '"><b>Crisis vote · year ' + rd.round + '</b>: ' + esc(recC.austerity) + ' austerity · ' + esc(recC.devaluation) + ' devaluation → <b>' + esc(recC.outcome) + '</b><div class="chips">' +
          cv.map(function (x) { return '<span class="chip vote">' + esc(MS.countryName(x.country)) + ': ' + esc(x.crisis) + '</span>'; }).join('') + missingC.map(function (g) { return '<span class="chip zero">' + esc(MS.countryName(g.country)) + ': austerity (no vote)</span>'; }).join('') + '</div></td></tr>';
      }
      if (!rd.decisions.length && !missing.length && !(recC && recC.status === 'closed')) return;
      if (idx === 0) { card.appendChild(el('h2', {}, [title])); card.appendChild(el('div', { html: h + '</tbody></table></div>' })); }
      else { var det = el('details', {}, [el('summary', {}, [title])]); det.appendChild(el('div', { html: h + '</tbody></table></div>' })); card.appendChild(det); }
      box.appendChild(card);
    });
  }

  /* ---------------- history ---------------- */
  function renderHistory() {
    var st = data.state, box = $('#history'); box.innerHTML = '';
    var past = (data.myDecisions || []).filter(function (d) { return d.phase === 'game' && Number(d.round) < Number(st.round); }).sort(function (a, b) { return a.round - b.round; });
    if (st.phase !== 'game' || !past.length) return;
    var det = el('details', {}, [el('summary', {}, ['Your previous decisions (' + past.length + ')'])]);
    past.forEach(function (d) { det.appendChild(el('div', { class: 'pledge', html: '<b>Year ' + d.round + '</b> <span class="muted small">' + esc(UI.fmtDateTime(d.ts)) + '</span><br>' + UI.chipsHtml(d.payload.years[0]) + UI.voteChipsHtml(d.payload.votes, { crisis: crisisHeld(d.round) }) + '<p class="small" style="margin:6px 0 0">' + esc(d.payload.text) + '</p>' })); });
    box.appendChild(el('div', { class: 'card' }, [det]));
  }

  /* ---------------- timers ---------------- */
  tick = setInterval(updateCountdown, 1000);
  pollTimer = setInterval(function () { if (!document.hidden && pin) load(true); }, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && pin) load(true); });
  load();
})();
