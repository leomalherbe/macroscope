<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macroscope · Board</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="core.js"></script>
<script src="app-common.js"></script>
</head>
<body class="board">

<div class="topbar">
  <div class="wrap">
    <div>
      <div class="kicker" id="courseLabel">Macroscope · the open-economy policy game</div>
      <h1 id="title">OPEN-MU</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="who" id="who"></div>
  </div>
</div>

<main><div class="wrap" id="app"><div class="card"><p class="muted">Loading…</p></div></div></main>
<footer><div class="wrap"><span>Macroscope · live board · engine OPEN-MU</span><span id="footTime"></span></div></footer>

<script>
(function () {
  'use strict';
  var $ = UI.$, el = UI.el, esc = UI.esc;
  var cfg = window.MACSIM_CONFIG || {};
  $('#courseLabel').textContent = cfg.COURSE_LABEL || 'Macroscope';
  var classId = new URLSearchParams(location.search).get('class') || '';
  var app = $('#app'), data = null, offset = 0;

  async function load() {
    if (!classId) { app.innerHTML = '<div class="card alert">Missing <span class="mono">?class=</span> in the URL — open the board from the administrator console.</div>'; return; }
    try {
      var r = await MSApi.call('board', { classId: classId });
      if (!r.ok) { app.innerHTML = '<div class="card alert">' + esc(r.error) + '</div>'; return; }
      data = r; offset = Date.parse(r.now) - Date.now();
      render(); $('#footTime').textContent = 'Updated ' + UI.fmtTime(r.now);
    } catch (e) { $('#footTime').textContent = 'Connection lost… retrying'; }
  }
  function phaseLabel(st) { return st.phase === 'warmup' ? 'Warm-up · ' + MS.countryName(st.warmup.country) + ' · ' + st.warmup.years + '-year plan' : 'Year ' + st.round + ' of ' + st.years; }
  function groupName(id) { var g = (data.groups || []).filter(function (x) { return x.groupId === id; })[0]; return g ? g.name : id; }

  function unionCard(rows, title) {
    var last = (rows || []).filter(function (r) { return r.detail && r.detail.extra; }).sort(function (a, b) { return b.year - a.year; })[0];
    if (!last) return null;
    var u = last.detail.extra;
    var pct = u.R0 ? Math.max(0, Math.min(100, 100 * u.R / u.R0)) : 0;
    var c = el('div', { class: 'card' + (u.alert ? ' alert' : '') });
    c.appendChild(el('div', { class: 'cardhead' }, [el('h2', {}, [title]), el('span', { class: 'small muted' }, ['after year ' + last.year])]));
    c.appendChild(el('div', { class: 'union', html:
      (u.regime === 'float'
        ? '<div class="urow"><span>Foreign reserves (frozen while floating)</span><span class="num">' + esc(MS.fmt(pct, 0)) + ' % of initial</span></div>'
        : '<div class="urow"><span>Foreign reserves</span><span class="num">' + esc(MS.fmt(Math.max(0, u.months), 1)) + ' months of imports · ' + esc(MS.fmt(pct, 0)) + ' % of initial' + (u.alert ? ' <span class="pill closed">ALERT</span>' : '') + '</span></div>' +
          '<div class="bar reserves"><i class="' + (u.alert ? 'neg' : '') + '" style="left:0;width:' + pct + '%"></i><b style="left:25%"></b></div>') +
      '<div class="urow"><span>Current account with the rest of the world</span><span class="num ' + UI.signedClass(u.CA) + '">' + esc(MS.fmt(u.CA, 2, true)) + '</span></div>' +
      '<div class="urow"><span>Exchange rate</span><span class="num">' + esc(MS.fmt(u.xr, 3)) + '</span></div>' +
      UI.regimeLinesHtml(u) + UI.exitLinesHtml(u) + UI.climateLinesHtml(u) + UI.voteLinesHtml(u) + crisisRoundHtml() + retaliationRoundHtml() }));
    return c;
  }
  /* the reserves-crisis round of the current year (voted before the decisions): in progress, or its outcome */
  function crisisRoundHtml() {
    var st = data.state, rec = st.phase === 'game' ? MS.crisisOf(st, st.round) : null; if (!rec) return '';
    var playing = (data.groups || []).filter(function (g) { return g.country; }).length;
    var cur = rec.kind === 'currency', lab = cur ? 'Currency-crisis vote' : 'Crisis vote';
    if (rec.status === 'open') return '<div class="urow"><span>' + lab + ' · year ' + esc(st.round) + '</span><span class="num"><span class="pill open">in progress</span> ' + esc(data.crisisVotesIn || 0) + ' of ' + playing + ' countries have voted</span></div>';
    if (rec.status === 'forced') return '<div class="urow"><span>Year ' + esc(st.round) + '</span><span class="num neg">reserves exhausted → forced devaluation</span></div>';
    if (cur) return '<div class="urow"><span>' + lab + ' · year ' + esc(st.round) + '</span><span class="num">' + esc(rec.austerity) + ' defend · ' + esc(rec.devaluation) + ' let it float → <b>' + (rec.outcome === 'float' ? 'let it float' : 'defend') + '</b></span></div>';
    return '<div class="urow"><span>Crisis vote · year ' + esc(st.round) + '</span><span class="num">' + esc(rec.austerity) + ' austerity · ' + esc(rec.devaluation) + ' devaluation → <b>' + esc(rec.outcome) + '</b></span></div>';
  }
  /* §12: the councils on retaliation of the current year */
  function retaliationRoundHtml() {
    var st = data.state; if (st.phase !== 'game') return '';
    var y = (st.retaliation || {})[String(st.round)] || {}, h = '';
    Object.keys(y).sort().forEach(function (tg) {
      var r = MS.retaliationOf(st, st.round, tg); if (!r) return;
      if (r.status === 'open') h += '<div class="urow"><span>Council on retaliation against ' + esc(MS.countryName(tg)) + '</span><span class="num"><span class="pill open">in progress</span> ' + esc(data.retaliationVotesIn || 0) + ' vote(s)</span></div>';
      else { var o = r.outcome || {}; h += '<div class="urow"><span>Council on retaliation against ' + esc(MS.countryName(tg)) + ' · year ' + esc(st.round) + '</span><span class="num">tariff ' + esc(MS.fmt(o.tariff || 0, 0)) + ' % · sale ' + esc(MS.fmt(o.sale || 0, 0)) + ' %' + (r.settleOpen ? ' · TARGET settled: ' + (o.settle ? 'yes' : 'no') : '') + '</span></div>'; }
    });
    return h;
  }
  function render() {
    var st = data.state;
    $('#title').textContent = 'Macroscope · ' + data.className;
    $('#sub').textContent = MS.isDuel(st) ? 'Arcade duels: two countries, two currencies, one shared climate — every pair is its own world.' : st.phase === 'warmup' ? 'Every group governs ' + MS.countryName(st.warmup.country) + ' for ' + st.warmup.years + ' years while the other economies stand still.' : 'One monetary union, one world: your decisions move everyone else.';
    var who = $('#who'); who.innerHTML = '';
    who.appendChild(el('span', { class: 'big', style: 'color:#fff' }, [phaseLabel(st)]));
    who.appendChild(el('br'));
    who.appendChild(el('span', { class: 'pill ' + (data.roundOpen ? 'open' : 'closed') }, [data.roundOpen ? 'submissions open' : 'submissions closed']));
    if (st.phase === 'game' && st.councilOpen) who.appendChild(el('span', { class: 'pill gold', style: 'margin-left:6px' }, ['council in session']));
    if (st.deadline && data.roundOpen) who.appendChild(el('span', { class: 'countdown', id: 'countdown', style: 'margin-left:10px' }, ['–:––']));
    updateCountdown();

    app.innerHTML = '';
    if (st.communique) app.appendChild(el('div', { class: 'communique', style: 'margin-bottom:18px;font-size:1.15rem' }, [el('div', { class: 'kicker' }, ['Administrator’s communiqué']), st.communique]));

    var left = el('div'), right = el('div'), reveals = [];
    /* submissions */
    var subCard = el('div', { class: 'card' }); subCard.appendChild(el('h2', {}, ['Submissions']));
    var grid = el('div', { class: 'status-grid' });
    (data.groups || []).slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).forEach(function (g) {
      var inn = (data.submitted || []).indexOf(g.groupId) >= 0;
      grid.appendChild(el('div', { class: 'g ' + (inn ? 'in' : 'missing') }, [el('b', {}, [st.phase === 'game' && g.country ? MS.countryName(g.country) : g.name]), el('span', { class: 'small' }, [st.phase === 'game' && g.country ? g.name + ' · ' : '', inn ? 'submitted ✓' : 'waiting…'])]));
    });
    subCard.appendChild(grid);
    right.appendChild(subCard);
    if (st.phase === 'game' && MS.isDuel(st)) {
      /* duel: one panel per pair (exchange rate, both reserves, climate, R of both) */
      var pairs = {};
      (data.groups || []).forEach(function (g) { var d = MS.duelOf(g.country); if (!d) return; pairs[d.pair] = pairs[d.pair] || { pair: d.pair }; pairs[d.pair][d.side] = g; });
      var pc = el('div', { class: 'card' }); pc.appendChild(el('h2', {}, ['The duels']));
      var pg = el('div', { class: 'trajgrid' }), anyP = false;
      Object.keys(pairs).map(Number).sort(function (a, b) { return a - b; }).forEach(function (k) {
        var pr = pairs[k];
        var lat = (data.union || []).filter(function (r) { return r.phase === 'game' && r.key === 'DUEL:p' + k && r.detail && r.detail.extra; }).sort(function (a, b) { return b.year - a.year; })[0];
        var box = el('div', { class: 'union', style: 'padding:10px 12px' });
        box.appendChild(el('h3', {}, ['Pair ' + k + ' · ' + (pr.A ? pr.A.name : 'A') + ' vs ' + (pr.B ? pr.B.name : 'B') + (lat ? ' · after year ' + lat.year : '')]));
        if (lat) {
          anyP = true;
          var rs = ['A', 'B'].map(function (sd) { var g = pr[sd]; var rows = g ? (data.gameResults || []).filter(function (r) { return r.key === g.country; }) : []; var cum = rows.reduce(function (a, r) { return a + MS.num(r.R); }, 0); return 'Country ' + sd + ' R ' + MS.fmt(cum, 2, true); });
          box.appendChild(el('div', { html: UI.duelPanelHtml(lat.detail.extra, null) }));
          box.appendChild(el('p', { class: 'small', style: 'margin:.3em 0 0' }, ['Cumulative R — ' + rs.join(' · ')]));
        } else box.appendChild(el('p', { class: 'muted small' }, ['No year simulated yet.']));
        pg.appendChild(box);
      });
      pc.appendChild(pg);
      if (!Object.keys(pairs).length) pc.appendChild(el('p', { class: 'muted' }, ['No pair yet.']));
      left.appendChild(pc);
    } else if (st.phase === 'game') { var uc = unionCard(data.union || [], 'The monetary union'); if (uc) left.appendChild(uc); }

    if (st.phase === 'game') {
      /* ranking */
      var lb = MS.leaderboard(data.gameResults || [], st.weights);
      var c = el('div', { class: 'card' }); c.appendChild(el('h2', {}, ['Ranking']));
      if (!st.publishLeaderboard) c.appendChild(el('p', { class: 'muted' }, ['The ranking is hidden for now.']));
      else if (!lb.length) c.appendChild(el('p', { class: 'muted' }, ['The ranking appears after the first simulated year.']));
      else {
        var maxAbs = Math.max.apply(null, lb.map(function (r) { return Math.abs(r.cumR || 0); }).concat([0.01]));
        var yrs = {}; lb.forEach(function (r) { Object.keys(r.years).forEach(function (y) { yrs[y] = true; }); });
        var yl = Object.keys(yrs).map(Number).sort(function (a, b) { return a - b; });
        var h = '<div class="tablewrap"><table><thead><tr><th>#</th><th>Country</th>' + yl.map(function (y) { return '<th class="num">R · y' + y + '</th>'; }).join('') + '<th class="num">Cumulative R</th><th></th></tr></thead><tbody>';
        lb.forEach(function (r) {
          var cr = r.latestR === null ? null : r.cumR;
          var pct = Math.abs(cr || 0) / maxAbs * 50;
          h += '<tr><td class="rank">' + r.rank + '</td><td><b>' + esc(MS.countryName(r.key)) + '</b><br><span class="small muted">' + esc(groupName(((data.groups || []).filter(function (g) { return g.country === r.key; })[0] || {}).groupId)) + '</span></td>' +
            yl.map(function (y) { var e = r.years[y]; return '<td class="num ' + (e ? UI.signedClass(e.R) : '') + '">' + esc(e ? MS.fmt(e.R, 3, true) : '—') + '</td>'; }).join('') +
            '<td class="num ' + UI.signedClass(cr) + '"><b>' + esc(MS.fmt(cr, 3, true)) + '</b></td><td><div class="bar"><i class="' + ((cr || 0) < 0 ? 'neg' : '') + '" style="left:' + ((cr || 0) < 0 ? 50 - pct : 50) + '%;width:' + pct + '%"></i></div></td></tr>';
        });
        c.appendChild(el('div', { html: h + '</tbody></table></div>' }));
        var elec = (data.groups || []).filter(function (g) { return g.country; }).map(function (g) { return { c: g.country, wi: MS.weightsInfo(st, st.round, g.country) }; }).filter(function (x) { return x.wi.elected; });
        if (elec.length) c.appendChild(el('p', { class: 'small', style: 'margin:.4em 0 0', html: '<b>Elections</b> — objective weights in force in year ' + esc(st.round) + ': ' + elec.map(function (x) { return esc(MS.countryName(x.c)) + ' · ' + esc(UI.weightsLine(x.wi.weights, x.wi.label)); }).join(' ; ') }));
        c.appendChild(el('p', { class: 'muted small' }, [(MS.isDuel(st) ? 'Every player of every pair. ' : '') + 'R is the score of each year: ' + st.weights.gdp + '·ΔGDP − ' + st.weights.unemp + '·Δunemployment − ' + st.weights.infl + '·Δinflation + ' + st.weights.pubbal + '·Δpublic balance + ' + st.weights.tradebal + '·Δtrade balance (deviations from the reference path). Countries are ranked by the cumulative R, the sum of their yearly scores.']));
        /* latest year detail */
        var latestYear = Math.max.apply(null, yl);
        var det = el('div', { class: 'card' }); det.appendChild(el('h2', {}, ['Year ' + latestYear + ' in detail']));
        var hasComp = lb.some(function (r) { var e = r.years[latestYear]; return e && e.detail && e.detail.extra && e.detail.extra.compet !== undefined; });
        var hasSpread = lb.some(function (r) { var e = r.years[latestYear]; return e && e.detail && e.detail.extra && e.detail.extra.spread !== undefined; });
        var hasE = lb.some(function (r) { var e = r.years[latestYear]; return e && e.detail && e.detail.extra && e.detail.extra.E !== undefined; });
        var hd = '<div class="tablewrap"><table><thead><tr><th>Country</th>' + MS.indicatorsFor(st).map(function (i) { return '<th class="num">' + esc(i.label) + '<br><span style="font-weight:400;text-transform:none;letter-spacing:0">' + esc(i.unit) + '</span></th>'; }).join('') + '<th class="num">R</th>' + (hasComp ? '<th class="num">Price level<br><span style="font-weight:400;text-transform:none;letter-spacing:0">% vs union</span></th>' : '') + (hasSpread ? '<th class="num">Risk premium<br><span style="font-weight:400;text-transform:none;letter-spacing:0">pt</span></th>' : '') + (hasE ? '<th class="num">Emissions<br><span style="font-weight:400;text-transform:none;letter-spacing:0">% vs reference</span></th>' : '') + '</tr></thead><tbody>';
        lb.forEach(function (r) { var e = r.years[latestYear]; if (!e) return; var cp = e.detail && e.detail.extra ? e.detail.extra.compet : undefined; hd += '<tr><td><b>' + esc(MS.countryName(r.key)) + '</b></td>' + MS.indicatorsFor(st).map(function (i) { return '<td class="num ' + UI.signedClass(i.sign * MS.num(e[i.id])) + '">' + esc(MS.fmt(e[i.id], 3, true)) + '</td>'; }).join('') + '<td class="num ' + UI.signedClass(e.R) + '"><b>' + esc(MS.fmt(e.R, 3, true)) + '</b></td>' + (hasComp ? '<td class="num ' + (cp === undefined ? '' : UI.signedClass(-cp)) + '">' + esc(cp === undefined ? '—' : MS.fmt(cp, 2, true)) + '</td>' : '') + (hasSpread ? '<td class="num ' + (e.detail && e.detail.extra && e.detail.extra.spread > 0 ? 'neg' : '') + '">' + esc(e.detail && e.detail.extra && e.detail.extra.spread !== undefined ? MS.fmt(e.detail.extra.spread, 2) : '—') + '</td>' : '') + (hasE ? '<td class="num ' + (e.detail && e.detail.extra && e.detail.extra.E !== undefined ? UI.signedClass(-e.detail.extra.E) : '') + '">' + esc(e.detail && e.detail.extra && e.detail.extra.E !== undefined ? MS.fmt(e.detail.extra.E, 0, true) : '—') + '</td>' : '') + '</tr>'; });
        det.appendChild(el('div', { html: hd + '</tbody></table></div>' }));
        left.appendChild(c); left.appendChild(det);
        /* fact sheets: the key indicators of every country, end of the latest year */
        var fc = el('div', { class: 'card' }); fc.appendChild(el('h2', {}, ['Key indicators · end of year ' + latestYear]));
        var fg = el('div', { class: 'factgrid' });
        function uxr(y) { var u = (data.union || []).filter(function (r) { return r.phase === 'game' && r.key === 'UNION' && Number(r.year) === Number(y) && r.detail && r.detail.extra; })[0]; return u ? u.detail.extra.xr : null; }
        lb.slice().sort(function (a, b) { return MS.countryName(a.key).localeCompare(MS.countryName(b.key)); }).forEach(function (r) {
          var e = r.years[latestYear]; if (!e) return; var p0 = r.years[latestYear - 1] || null;
          var gname = groupName(((data.groups || []).filter(function (g) { return g.country === r.key; })[0] || {}).groupId);
          var ex = e.detail && e.detail.extra && e.detail.extra.exited ? ' <span class="pill closed">out of the union</span>' : '';
          fg.appendChild(el('div', { class: 'country', html: '<h3>' + esc(MS.countryName(r.key)) + (gname ? ' <span class="small muted">' + esc(gname) + '</span>' : '') + ex + '</h3>' + UI.factSheetHtml(e, p0, { xr: uxr(latestYear), xrPrev: p0 ? uxr(latestYear - 1) : null, mini: true }) }));
        });
        fc.appendChild(fg);
        fc.appendChild(el('p', { class: 'muted small' }, ['Levels for inflation, unemployment and debt; GDP as the gap to the reference path; balances in % of GDP. Arrows: change since the previous year, green when it helps the country.']));
        left.appendChild(fc);
        /* trajectories: one small chart per country */
        var tg = el('div', { class: 'trajgrid' });
        lb.forEach(function (r) {
          var rows = Object.keys(r.years).map(function (yy) { return r.years[yy]; });
          var gname = groupName(((data.groups || []).filter(function (g) { return g.country === r.key; })[0] || {}).groupId);
          tg.appendChild(el('div', { html: UI.trajectorySvg(rows, { weights: st.weights, title: MS.countryName(r.key) + (gname ? ' · ' + gname : ''), height: 250, legend: false, fontScale: 1.6 }) }));
        });
        var tc = el('div', { class: 'card' }); tc.appendChild(el('h2', {}, ['The objective, year by year']));
        tc.appendChild(tg);
        tc.appendChild(el('div', { html: UI.trajectoryLegendHtml(MS.isEcoModel(st)) }));
        tc.appendChild(el('p', { class: 'trajcap' }, ['Each bar stacks the contributions of the five dimensions to R for the year (weight × deviation; unemployment and inflation count negatively): above zero what helped, below zero what hurt. The dashed line is R itself.']));
        left.appendChild(tc);
      }
      if (!lb.length || !st.publishLeaderboard) left.appendChild(c);
      /* council */
      if (st.councilOpen) {
        var cc = el('div', { class: 'card tint' }); cc.appendChild(el('div', { class: 'cardhead' }, [el('h2', {}, ['Council of ministers · year ' + st.round]), el('span', { class: 'pill gold' }, ['in session'])]));
        var pl = (data.pledges || []).slice().sort(function (a, b) { return String(a.ts) < String(b.ts) ? -1 : 1; });
        if (!pl.length) cc.appendChild(el('p', { class: 'muted' }, ['No pledge on the table yet.']));
        pl.forEach(function (p) { cc.appendChild(el('div', { class: 'pledge', html: '<b>' + esc(MS.countryName(p.country)) + '</b> <span class="muted small">' + esc(UI.fmtTime(p.ts)) + '</span><br>' + esc(p.text) + '<div class="vals">' + UI.pledgeChipsHtml(p.payload) + '</div>' })); });
        right.appendChild(cc);
      }
      /* everyone's decisions once the round is over */
      var dl = (data.decisionsAll || []).slice().sort(function (a, b) { return b.round - a.round; })[0];
      if (dl) {
        var hd2 = '<div class="tablewrap"><table><thead><tr><th>Country</th><th>Decisions</th></tr></thead><tbody>';
        dl.decisions.slice().sort(function (a, b) { return MS.countryName(a.country).localeCompare(MS.countryName(b.country)); }).forEach(function (d) { hd2 += '<tr><td><b>' + esc(MS.countryName(d.country)) + '</b><br><span class="small muted">' + esc(groupName(d.groupId)) + '</span></td><td>' + UI.chipsHtml(d.payload.years[0]) + '</td></tr>'; });
        (data.groups || []).filter(function (g) { return g.country && !dl.decisions.some(function (d) { return d.groupId === g.groupId; }); }).forEach(function (g) { hd2 += '<tr><td><b>' + esc(MS.countryName(g.country)) + '</b><br><span class="small muted">' + esc(g.name) + '</span></td><td><span class="chip zero">no decision submitted</span></td></tr>'; });
        right.appendChild(el('div', { class: 'card' }, [el('h2', {}, ['Everyone’s decisions · year ' + dl.round]), el('div', { html: hd2 + '</tbody></table></div>' })]));
      } else if (data.roundOpen) {
        right.appendChild(el('div', { class: 'card' }, [el('h2', {}, ['Decisions']), el('p', { class: 'muted' }, ['Each country’s decisions stay secret until the round is closed.'])]));
      }
      /* reveals */
      (data.reveals || []).slice().sort(function (a, b) { return b.round - a.round; }).forEach(function (rv) {
        var h2 = '<div class="tablewrap"><table><thead><tr><th>Country</th><th>Pledge</th><th>Decision</th><th>Verdict</th></tr></thead><tbody>';
        var countries = {}; rv.pledges.forEach(function (p) { countries[p.country] = 1; }); rv.decisions.forEach(function (d) { countries[d.country] = 1; });
        Object.keys(countries).sort().forEach(function (cid) {
          var p = rv.pledges.filter(function (x) { return x.country === cid; })[0], d = rv.decisions.filter(function (x) { return x.country === cid; })[0];
          var verdict = '<span class="muted">no pledge</span>';
          if (p) { var k = MS.pledgeVerdict(p.payload, d ? d.payload : null); verdict = !k.items.length ? '<span class="muted">words only</span>' : (k.kept ? '<span class="kept">✓ kept</span>' : '<span class="broken">✗ broken</span>'); }
          h2 += '<tr><td><b>' + esc(MS.countryName(cid)) + '</b></td><td>' + (p ? esc(p.text) + '<div class="vals">' + UI.pledgeChipsHtml(p.payload) + '</div>' : '—') + '</td><td>' + (d ? UI.chipsHtml(d.payload.years[0]) + UI.voteChipsHtml(d.payload.votes, { crisis: true }) : '<span class="muted">no decision</span>') + '</td><td>' + verdict + '</td></tr>';
        });
        reveals.push(el('div', { class: 'card' }, [el('h2', {}, ['Pledges vs decisions · year ' + rv.round]), el('div', { html: h2 + '</tbody></table></div>' })]));
      });
    } else {
      /* warm-up */
      var wc = el('div', { class: 'card' }); wc.appendChild(el('h2', {}, ['Warm-up']));
      wc.appendChild(el('p', {}, ['Each group submits a ' + st.warmup.years + '-year plan for ' + MS.countryName(st.warmup.country) + ' (at most ' + (st.warmup.maxNonZero || 'any number of') + ' instruments, each within ±' + st.bounds.lever + '). The administrator runs the plans in the model; results come back to each group.']));
      if (st.revealWarmup && (data.warmupAll || []).length) {
        var byG = {}; data.warmupAll.forEach(function (r) { (byG[r.key] = byG[r.key] || {})[r.year] = r; });
        var years = []; for (var y = 1; y <= st.warmup.years; y++) years.push(y);
        var rows = Object.keys(byG).map(function (k) { var rs = years.map(function (yy) { return byG[k][yy] ? byG[k][yy].R : null; }); var vals = rs.filter(function (x) { return x !== null; }); return { key: k, rs: rs, avg: vals.length ? MS.round3(vals.reduce(function (a, b) { return a + b; }, 0)) : null }; });
        rows.sort(function (a, b) { return (b.avg === null ? -1e9 : b.avg) - (a.avg === null ? -1e9 : a.avg); });
        var lastY = years[years.length - 1];
        var hw = '<div class="tablewrap"><table><thead><tr><th>#</th><th>Group · plan</th>' + years.map(function (yy) { return '<th class="num">R · year ' + yy + '</th>'; }).join('') + '<th class="num">Cumulative R</th></tr></thead><tbody>';
        rows.forEach(function (r, i) {
          var plan = (data.warmupPlans || []).filter(function (pl) { return pl.groupId === r.key; })[0];
          var planHtml = plan && plan.payload && plan.payload.years ? '<div class="small" style="margin-top:2px">' + plan.payload.years.map(function (yy, k) {
            var ch = UI.yearChips(yy); return '<span class="muted">Y' + (k + 1) + '</span> ' + (ch.length ? ch.map(function (c) { return esc(c.label) + ' <b>' + esc(MS.fmt(c.value, 1, true)) + esc(c.unit || '') + '</b>'; }).join(', ') : '<span class="muted">no change</span>');
          }).join(' &nbsp;·&nbsp; ') + '</div>' : '';
          var last = byG[r.key][lastY];
          var SHORT = { gdp: 'GDP', unemp: 'U', infl: 'π', pubbal: 'PB', tradebal: 'TB', emis: 'Emis' };
          var lastHtml = last ? '<div class="small muted" style="margin-top:3px">year ' + lastY + ': ' + MS.indicatorsFor(st).map(function (ind) { return esc(SHORT[ind.id] || ind.label) + ' <span class="' + UI.signedClass(ind.sign * MS.num(last[ind.id])) + '">' + esc(MS.fmt(last[ind.id], 2, true)) + '</span>'; }).join(' · ') + '</div>' : '';
          hw += '<tr><td class="rank">' + (i + 1) + '</td><td><b>' + esc(groupName(r.key)) + '</b>' + planHtml + lastHtml + '</td>' + r.rs.map(function (x) { return '<td class="num ' + UI.signedClass(x) + '">' + esc(MS.fmt(x, 3, true)) + '</td>'; }).join('') + '<td class="num ' + UI.signedClass(r.avg) + '"><b>' + esc(MS.fmt(r.avg, 3, true)) + '</b></td></tr>';
        });
        wc.appendChild(el('h3', { style: 'margin-top:12px' }, ['Debrief · all groups'])); wc.appendChild(el('div', { html: hw + '</tbody></table></div>' }));
        var tgw = el('div', { class: 'trajgrid', style: 'margin-top:12px' });
        rows.forEach(function (r) { tgw.appendChild(el('div', { html: UI.trajectorySvg(years.map(function (yy) { return byG[r.key][yy]; }).filter(function (x) { return !!x; }), { weights: st.weights, title: groupName(r.key), height: 250, legend: false, fontScale: 1.6 }) })); });
        wc.appendChild(el('h3', { style: 'margin-top:14px' }, ['The objective, year by year'])); wc.appendChild(tgw); wc.appendChild(el('div', { html: UI.trajectoryLegendHtml(MS.isEcoModel(st)) }));
        wc.appendChild(el('p', { class: 'trajcap' }, ['Each bar stacks the contributions of the five dimensions to R for the year (weight × deviation; unemployment and inflation count negatively): above zero what helped, below zero what hurt. The dashed line is R itself.']));
        wc.appendChild(el('p', { class: 'xs muted', style: 'margin:.5em 0 0' }, ['Ranked by the cumulative R, the sum of the yearly scores over the plan (R weighs the year’s deviations from the reference path: GDP in %, the rest in points). Each group governed ' + MS.countryName(st.warmup.country) + ' alone, under the same shocks.']));
      }
      left.appendChild(wc);
    }
    app.appendChild(el('div', { class: 'grid2' }, [left, right]));
    reveals.forEach(function (c) { app.appendChild(c); });
  }
  function updateCountdown() {
    var c = $('#countdown'); if (!c || !data) return;
    var t = UI.countdownText(data.state.deadline, offset); if (!t) return;
    c.textContent = (t.late ? 'time is up ' : '') + t.text; c.classList.toggle('late', t.late);
  }
  setInterval(updateCountdown, 1000);
  setInterval(load, 15000);
  load();
})();
</script>
